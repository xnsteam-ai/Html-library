name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verify registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The generated registry is committed so raw.githubusercontent.com works;
      # this fails the build if someone edited registry/ without regenerating.
      - run: npm run verify:registry
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    name: Deploy to Pages
    # Deploys from whichever branch is the repository default, so the workflow
    # works before and after the initial branch is merged or renamed. Manual
    # runs (workflow_dispatch) on the default branch deploy too, not just push.
    if: >
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build site and registry
        run: npm run build
        env:
          GITHUB_PAGES: '1'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
