<!-- Site Storefront — restored with its own scoped neutral theme -->
<style>
  .sst-root {
    --bg-app: #f4f4f6; --bg-surface: #ffffff; --border-color: rgba(0,0,0,.08); --border-hover: rgba(0,0,0,.18);
    --text-primary: #171717; --text-secondary: #555555; --text-muted: #999999;
    --bg-hover: rgba(0,0,0,.04); --send-btn-bg: #171717; --send-btn-fg: #ffffff;
  }
  .dark .sst-root {
    --bg-app: #141414; --bg-surface: #222222; --border-color: rgba(255,255,255,.07); --border-hover: rgba(255,255,255,.14);
    --text-primary: #e8e8e8; --text-secondary: #999999; --text-muted: #555555;
    --bg-hover: rgba(255,255,255,.04); --send-btn-bg: rgba(255,255,255,.08); --send-btn-fg: #999999;
  }
</style>

<div class="sst-root flex h-[800px] w-[1280px] flex-col overflow-hidden bg-[var(--bg-app)]">
  <header class="relative z-30 flex shrink-0 items-center justify-between border-b border-[var(--border-color)] bg-[var(--bg-surface)] px-6 py-4">
    <span class="flex items-center gap-3">
      <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--bg-hover)]">
        <svg class="h-4 w-4 text-[var(--text-primary)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l1.5 6M18 2l-1.5 6M3 6h18l-1.5 12a2 2 0 01-2 2H6.5a2 2 0 01-2-2z" /></svg>
      </span>
      <span class="text-[15px] font-bold tracking-tight text-[var(--text-primary)]">Lumen</span>
    </span>

    <nav class="flex items-center gap-1">
      <div class="group relative flex h-full items-center">
        <span class="flex cursor-pointer items-center gap-1 rounded-lg px-3 py-2 text-[13.5px] font-medium text-[var(--text-secondary)] group-hover:bg-[var(--bg-hover)] group-hover:text-[var(--text-primary)]">
          Shop
          <svg class="mt-0.5 h-3.5 w-3.5 opacity-50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" /></svg>
        </span>
        <div class="absolute left-1/2 top-full z-40 hidden w-[440px] -translate-x-1/2 gap-6 rounded-2xl border border-[var(--border-color)] bg-[var(--bg-surface)] p-6 shadow-xl group-hover:flex">
          <div class="grid flex-1 grid-cols-2 gap-x-6 gap-y-4">
            <span class="flex items-start gap-2.5"><span class="rounded bg-[var(--bg-hover)] p-1.5 text-[var(--text-secondary)]"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z" /></svg></span><span class="text-[12.5px] font-semibold text-[var(--text-primary)]">New Arrivals</span></span>
            <span class="flex items-start gap-2.5"><span class="rounded bg-[var(--bg-hover)] p-1.5 text-[var(--text-secondary)]"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 4L4 20M4 4l16 16" /></svg></span><span class="text-[12.5px] font-semibold text-[var(--text-primary)]">Womenswear</span></span>
            <span class="flex items-start gap-2.5"><span class="rounded bg-[var(--bg-hover)] p-1.5 text-[var(--text-secondary)]"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20.6 3.4L3.4 20.6" /></svg></span><span class="text-[12.5px] font-semibold text-[var(--text-primary)]">Menswear</span></span>
            <span class="flex items-start gap-2.5"><span class="rounded bg-[var(--bg-hover)] p-1.5 text-[var(--text-secondary)]"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1H4a1 1 0 01-1-1z" /></svg></span><span class="text-[12.5px] font-semibold text-[var(--text-primary)]">Home</span></span>
          </div>
          <div class="w-40 shrink-0 border-l border-[var(--border-color)] pl-6">
            <div class="aspect-[4/3] w-full rounded-lg bg-[var(--bg-hover)]"></div>
            <p class="mt-3 text-[12.5px] font-semibold text-[var(--text-primary)]">The Autumn Edit</p>
            <p class="mt-0.5 text-[11px] text-[var(--text-secondary)]">Layering staples in warm tones.</p>
          </div>
        </div>
      </div>
      <span class="rounded-lg px-3 py-2 text-[13.5px] font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)]">Brands</span>
      <span class="rounded-lg px-3 py-2 text-[13.5px] font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)]">Sale</span>
      <span class="rounded-lg px-3 py-2 text-[13.5px] font-medium text-[var(--text-secondary)] hover:bg-[var(--bg-hover)] hover:text-[var(--text-primary)]">Service</span>
    </nav>

    <div class="flex items-center gap-3">
      <span class="text-[13.5px] font-medium text-[var(--text-secondary)]">Sign in</span>
      <span class="flex items-center gap-2 rounded-lg bg-[var(--send-btn-bg)] px-3.5 py-2 text-[13.5px] font-medium text-[var(--send-btn-fg)]">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="21" r="1" /><circle cx="20" cy="21" r="1" /><path d="M1 1h4l2.7 13.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 6H6" /></svg>
        Checkout
        <span class="rounded-md bg-white/20 px-1.5 py-0.5 text-[10px] font-bold">3</span>
      </span>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-10">
    <div class="mx-auto flex max-w-[1100px] flex-col gap-10">
      <div class="flex h-[220px] items-center justify-center rounded-xl border border-[var(--border-color)] bg-[var(--bg-hover)] text-[var(--text-muted)]">Hero Banner</div>

      <div class="flex flex-col gap-4">
        <div class="h-5 w-40 rounded bg-[var(--bg-hover)]"></div>
        <div class="grid grid-cols-6 gap-4">
          <div class="flex flex-col gap-2"><div class="h-24 rounded-lg border border-[var(--border-color)] bg-[var(--bg-hover)]"></div><div class="h-3 w-3/5 rounded bg-[var(--bg-hover)]"></div></div>
          <div class="flex flex-col gap-2"><div class="h-24 rounded-lg border border-[var(--border-color)] bg-[var(--bg-hover)]"></div><div class="h-3 w-3/5 rounded bg-[var(--bg-hover)]"></div></div>
          <div class="flex flex-col gap-2"><div class="h-24 rounded-lg border border-[var(--border-color)] bg-[var(--bg-hover)]"></div><div class="h-3 w-3/5 rounded bg-[var(--bg-hover)]"></div></div>
          <div class="flex flex-col gap-2"><div class="h-24 rounded-lg border border-[var(--border-color)] bg-[var(--bg-hover)]"></div><div class="h-3 w-3/5 rounded bg-[var(--bg-hover)]"></div></div>
          <div class="flex flex-col gap-2"><div class="h-24 rounded-lg border border-[var(--border-color)] bg-[var(--bg-hover)]"></div><div class="h-3 w-3/5 rounded bg-[var(--bg-hover)]"></div></div>
          <div class="flex flex-col gap-2"><div class="h-24 rounded-lg border border-[var(--border-color)] bg-[var(--bg-hover)]"></div><div class="h-3 w-3/5 rounded bg-[var(--bg-hover)]"></div></div>
        </div>
      </div>
    </div>
  </main>
</div>
