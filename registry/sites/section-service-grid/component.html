<!--
  Service Grid — a 2×2 directory of service categories.
  Each card pairs a pastel panel (title, blurb, tag pills) with an "Explore"
  footer. The tag pills and arrow are real buttons but carry no handlers, so
  the section stays static markup.
-->
<section class="w-full bg-[#f8fafc] py-16 dark:bg-neutral-950">
  <div class="mx-auto w-full max-w-5xl px-6">
    <!-- Header -->
    <header class="mb-8 flex flex-col items-center justify-between gap-4 border-b border-slate-300/60 pb-6 sm:flex-row dark:border-white/10">
      <div>
        <h2 class="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl dark:text-slate-100">
          Explore Professional Services
        </h2>
      </div>
      <div class="w-full sm:w-auto">
        <div class="relative sm:w-64">
          <svg class="absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500 dark:text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <label for="sg-filter" class="sr-only">Filter services</label>
          <input
            id="sg-filter"
            type="text"
            placeholder="Filter tags or services…"
            class="w-full rounded-xl border border-slate-300/80 bg-white/80 py-2 pl-9 pr-4 text-sm shadow-sm outline-none transition-all placeholder:text-slate-500 dark:placeholder:text-neutral-500 focus:border-slate-800 focus:ring-2 focus:ring-slate-800/20 dark:border-white/15 dark:bg-white/5 dark:text-slate-100"
          />
        </div>
      </div>
    </header>

    <!-- 2×2 grid -->
    <div class="grid w-full grid-cols-1 gap-5 sm:gap-6 md:grid-cols-2">
      <!-- Web Design -->
      <div class="group flex flex-col justify-between rounded-[28px] border border-slate-100/80 bg-white p-3.5 shadow-sm transition-all duration-300 hover:shadow-xl sm:p-4 dark:border-white/10 dark:bg-neutral-900">
        <div class="flex min-h-[250px] flex-col justify-between rounded-[22px] bg-[#e2f2fe] p-6 transition-transform duration-300 group-hover:scale-[0.995] sm:p-7">
          <div>
            <h3 class="mb-2 text-2xl font-bold tracking-tight text-slate-900 sm:text-[28px]">Web Design</h3>
            <p class="mb-6 max-w-xs text-sm font-normal leading-snug text-slate-700 sm:text-[15px]">
              Crafts engaging, user-friendly websites.
            </p>
          </div>
          <div class="mt-auto flex flex-wrap gap-2.5">
            <button type="button" class="rounded-full bg-[#c3e4ff] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Landing Page</button>
            <button type="button" class="rounded-full bg-[#c3e4ff] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Website</button>
            <button type="button" class="rounded-full bg-[#c3e4ff] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">One Page</button>
          </div>
        </div>
        <div class="mt-1 flex items-center justify-between px-3 py-2.5">
          <span class="text-lg font-bold text-slate-900 dark:text-slate-100">Explore</span>
          <button type="button" aria-label="Explore Web Design" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-800 shadow-sm transition-all duration-200 hover:bg-slate-900 hover:text-white active:scale-95 group-hover:bg-slate-900 group-hover:text-white dark:border-white/10 dark:bg-neutral-800 dark:text-slate-200 dark:hover:bg-white dark:hover:text-neutral-900 dark:group-hover:bg-white dark:group-hover:text-neutral-900">
            <svg class="h-5 w-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Graphic Design -->
      <div class="group flex flex-col justify-between rounded-[28px] border border-slate-100/80 bg-white p-3.5 shadow-sm transition-all duration-300 hover:shadow-xl sm:p-4 dark:border-white/10 dark:bg-neutral-900">
        <div class="flex min-h-[250px] flex-col justify-between rounded-[22px] bg-[#fdebd8] p-6 transition-transform duration-300 group-hover:scale-[0.995] sm:p-7">
          <div>
            <h3 class="mb-2 text-2xl font-bold tracking-tight text-slate-900 sm:text-[28px]">Graphic Design</h3>
            <p class="mb-6 max-w-xs text-sm font-normal leading-snug text-slate-700 sm:text-[15px]">
              Creates impactful visuals and branding.
            </p>
          </div>
          <div class="mt-auto flex flex-wrap gap-2.5">
            <button type="button" class="rounded-full bg-[#fcd3b2] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Packaging</button>
            <button type="button" class="rounded-full bg-[#fcd3b2] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Brand Identity</button>
            <button type="button" class="rounded-full bg-[#fcd3b2] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Illustrations</button>
            <button type="button" class="rounded-full bg-[#fcd3b2] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Logo</button>
          </div>
        </div>
        <div class="mt-1 flex items-center justify-between px-3 py-2.5">
          <span class="text-lg font-bold text-slate-900 dark:text-slate-100">Explore</span>
          <button type="button" aria-label="Explore Graphic Design" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-800 shadow-sm transition-all duration-200 hover:bg-slate-900 hover:text-white active:scale-95 group-hover:bg-slate-900 group-hover:text-white dark:border-white/10 dark:bg-neutral-800 dark:text-slate-200 dark:hover:bg-white dark:hover:text-neutral-900 dark:group-hover:bg-white dark:group-hover:text-neutral-900">
            <svg class="h-5 w-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Developers -->
      <div class="group flex flex-col justify-between rounded-[28px] border border-slate-100/80 bg-white p-3.5 shadow-sm transition-all duration-300 hover:shadow-xl sm:p-4 dark:border-white/10 dark:bg-neutral-900">
        <div class="flex min-h-[250px] flex-col justify-between rounded-[22px] bg-[#ece3f7] p-6 transition-transform duration-300 group-hover:scale-[0.995] sm:p-7">
          <div>
            <h3 class="mb-2 text-2xl font-bold tracking-tight text-slate-900 sm:text-[28px]">Developers</h3>
            <p class="mb-6 max-w-xs text-sm font-normal leading-snug text-slate-700 sm:text-[15px]">
              Builds functional and scalable solutions.
            </p>
          </div>
          <div class="mt-auto flex flex-wrap gap-2.5">
            <button type="button" class="rounded-full bg-[#decdf8] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Web Applications</button>
            <button type="button" class="rounded-full bg-[#decdf8] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Mobile Apps</button>
            <button type="button" class="rounded-full bg-[#decdf8] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Database</button>
            <button type="button" class="rounded-full bg-[#decdf8] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Add-ons</button>
          </div>
        </div>
        <div class="mt-1 flex items-center justify-between px-3 py-2.5">
          <span class="text-lg font-bold text-slate-900 dark:text-slate-100">Explore</span>
          <button type="button" aria-label="Explore Developers" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-800 shadow-sm transition-all duration-200 hover:bg-slate-900 hover:text-white active:scale-95 group-hover:bg-slate-900 group-hover:text-white dark:border-white/10 dark:bg-neutral-800 dark:text-slate-200 dark:hover:bg-white dark:hover:text-neutral-900 dark:group-hover:bg-white dark:group-hover:text-neutral-900">
            <svg class="h-5 w-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Copywriting -->
      <div class="group flex flex-col justify-between rounded-[28px] border border-slate-100/80 bg-white p-3.5 shadow-sm transition-all duration-300 hover:shadow-xl sm:p-4 dark:border-white/10 dark:bg-neutral-900">
        <div class="flex min-h-[250px] flex-col justify-between rounded-[22px] bg-[#dcf3e8] p-6 transition-transform duration-300 group-hover:scale-[0.995] sm:p-7">
          <div>
            <h3 class="mb-2 text-2xl font-bold tracking-tight text-slate-900 sm:text-[28px]">Copywriting</h3>
            <p class="mb-6 max-w-xs text-sm font-normal leading-snug text-slate-700 sm:text-[15px]">
              Delivers persuasive and creative content.
            </p>
          </div>
          <div class="mt-auto flex flex-wrap gap-2.5">
            <button type="button" class="rounded-full bg-[#b3e8d0] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Blog Posts</button>
            <button type="button" class="rounded-full bg-[#b3e8d0] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Video Scripts</button>
            <button type="button" class="rounded-full bg-[#b3e8d0] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Sales Pages</button>
            <button type="button" class="rounded-full bg-[#b3e8d0] px-3.5 py-1.5 text-xs font-medium text-slate-800 transition-all hover:bg-slate-900 hover:text-white sm:text-[13px]">Slogans</button>
          </div>
        </div>
        <div class="mt-1 flex items-center justify-between px-3 py-2.5">
          <span class="text-lg font-bold text-slate-900 dark:text-slate-100">Explore</span>
          <button type="button" aria-label="Explore Copywriting" class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-800 shadow-sm transition-all duration-200 hover:bg-slate-900 hover:text-white active:scale-95 group-hover:bg-slate-900 group-hover:text-white dark:border-white/10 dark:bg-neutral-800 dark:text-slate-200 dark:hover:bg-white dark:hover:text-neutral-900 dark:group-hover:bg-white dark:group-hover:text-neutral-900">
            <svg class="h-5 w-5 stroke-[2.2]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
