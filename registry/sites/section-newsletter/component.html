<!-- Newsletter Section — a real subscribe form -->
<section class="w-full bg-gray-50 px-6 py-20 dark:bg-white/5">
  <div class="mx-auto max-w-xl text-center">
    <span class="mx-auto flex h-11 w-11 items-center justify-center rounded-xl bg-gray-900 text-white dark:bg-white dark:text-neutral-900">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" /><path d="M2 7l10 6 10-6" /></svg>
    </span>
    <h2 class="mt-5 text-[26px] font-semibold tracking-tight text-foreground dark:text-gray-100">
      Ship notes, once a week
    </h2>
    <p class="mt-2.5 text-[14.5px] leading-relaxed text-muted-foreground dark:text-muted-foreground">
      What changed, what broke, and what we learned fixing it. No fluff, unsubscribe any time.
    </p>

    <form class="mx-auto mt-7 flex max-w-sm items-center gap-2">
      <label for="section-newsletter-email" class="sr-only">Email address</label>
      <input
        id="section-newsletter-email"
        type="email"
        required
        placeholder="you@company.com"
        class="min-w-0 flex-1 rounded-xl border border-gray-200 bg-white px-3.5 py-2.5 text-[14px] text-foreground placeholder:text-muted-foreground focus:border-gray-400 focus:outline-none dark:border-white/15 dark:bg-neutral-950 dark:text-gray-100 dark:placeholder:text-muted-foreground"
      />
      <button type="submit" class="shrink-0 rounded-xl bg-gray-900 px-4 py-2.5 text-[14px] font-medium text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200">
        Subscribe
      </button>
    </form>
    <p class="mt-3 text-[12px] text-muted-foreground dark:text-muted-foreground">Read by 8,400+ engineers.</p>
  </div>
</section>
