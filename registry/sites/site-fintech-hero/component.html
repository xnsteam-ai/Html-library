<!-- Fintech Hero — full-bleed gradient backdrop with a floating nav and a footer-anchored headline, 1280×800 -->
<div class="relative flex h-[800px] w-[1280px] flex-col overflow-hidden bg-white font-sans text-black dark:bg-neutral-950 dark:text-white">
  <!-- Backdrop -->
  <div class="absolute inset-0 flex items-center justify-center">
    <div class="relative h-[80%] w-[80%] overflow-hidden rounded-2xl">
      <img
        src="https://images.unsplash.com/photo-1517241034903-9a4c3ab12f00?q=80&w=1600&auto=format&fit=crop"
        alt=""
        class="h-full w-full object-cover"
      />
      <div class="absolute inset-0 bg-[linear-gradient(150deg,rgba(15,23,42,0.15)_0%,transparent_40%,transparent_60%,rgba(15,23,42,0.25)_100%)]"></div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="relative z-10 flex shrink-0 items-center justify-between p-6 md:p-8">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <g transform="rotate(-35 12 12)">
            <rect x="4" y="7" width="10" height="10" rx="3" fill="currentColor" class="text-foreground dark:text-white" />
            <rect x="10" y="7" width="10" height="10" rx="3" fill="currentColor" opacity="0.75" class="text-foreground dark:text-white" />
          </g>
        </svg>
        <span class="text-sm font-semibold tracking-tight text-foreground dark:text-white">NeuralKinetics</span>
      </div>

      <button type="button" class="flex items-center gap-2 rounded-full bg-gray-900 py-1.5 pl-1.5 pr-3.5 text-white dark:bg-white dark:text-neutral-900">
        <span class="flex h-6 w-6 items-center justify-center rounded-full bg-white dark:bg-neutral-900">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="text-foreground dark:text-white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
        </span>
        <span class="text-[11px] font-medium">Menu</span>
      </button>

      <div class="hidden items-center gap-2 rounded-full bg-[#f4f4f6] px-3.5 py-1.5 md:flex dark:bg-white/10">
        <span class="text-[11px] font-medium text-foreground dark:text-white">Advanced Bionics</span>
        <span class="text-[10px] text-muted-foreground">•</span>
        <span class="text-[11px] font-medium text-foreground dark:text-white">Cognitive AI</span>
      </div>
    </div>

    <div class="hidden items-center gap-2 rounded-full bg-[#f4f4f6] py-1 pl-1 pr-3.5 md:flex dark:bg-white/10">
      <span class="flex h-6 w-6 items-center justify-center rounded-full bg-gray-900 dark:bg-white">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <circle cx="3" cy="3" r="1.5" class="fill-white dark:fill-neutral-900" />
          <circle cx="9" cy="3" r="1.5" class="fill-white dark:fill-neutral-900" />
          <circle cx="3" cy="9" r="1.5" class="fill-white dark:fill-neutral-900" />
          <circle cx="9" cy="9" r="1.5" class="fill-white dark:fill-neutral-900" />
        </svg>
      </span>
      <span class="text-[11px] font-medium text-foreground dark:text-white">Adaptive Systems</span>
    </div>
  </nav>

  <!-- Spacer pushes the footer content to the bottom, matching the fixed-nav / footer-overlay layout -->
  <div class="relative z-10 flex-1"></div>

  <!-- Footer overlay -->
  <footer class="relative z-10 flex shrink-0 flex-col gap-6 bg-[linear-gradient(to_top,#ffffff_0%,rgba(255,255,255,0.85)_55%,transparent_100%)] px-4 pb-6 pt-8 md:flex-row md:items-end md:justify-between md:px-8 md:pb-8 md:pt-12 dark:bg-[linear-gradient(to_top,#0a0a0a_0%,rgba(10,10,10,0.85)_55%,transparent_100%)]">
    <div class="flex flex-col gap-4">
      <div class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-gray-900 dark:bg-white"></span>
        <span class="text-[13px] text-black/55 dark:text-white/60">Best digital banking card 2026</span>
      </div>

      <h1 class="text-[2rem] font-light leading-none tracking-tight text-foreground md:text-[3.5rem] dark:text-white">
        One Card, Zero<br />Limits. Worldwide.
      </h1>

      <div class="flex items-center gap-3">
        <button type="button" class="rounded-full bg-gray-900 px-5 py-2.5 text-[13px] font-medium text-white transition hover:bg-black dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200">
          See Features
        </button>
        <button type="button" class="rounded-full border border-black/35 px-5 py-2.5 text-[13px] font-medium text-foreground transition hover:bg-black/5 dark:border-white/35 dark:text-white dark:hover:bg-white/10">
          How It Works
        </button>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <span class="rounded-full border border-black/10 bg-white px-3.5 py-1.5 text-[11px] font-medium text-foreground dark:border-white/15 dark:bg-white/10 dark:text-white">Neuromorphic</span>
      <span class="rounded-full border border-black/10 bg-white px-3.5 py-1.5 text-[11px] font-medium text-foreground dark:border-white/15 dark:bg-white/10 dark:text-white">AGI</span>
      <span class="rounded-full border border-black/10 bg-white px-3.5 py-1.5 text-[11px] font-medium text-foreground dark:border-white/15 dark:bg-white/10 dark:text-white">Cybernetics</span>
    </div>
  </footer>
</div>
