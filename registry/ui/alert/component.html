<!--
  Alert — info, success, warning, error and banner. The dismissible ones
  genuinely dismiss: the close control is a <label> over a hidden checkbox,
  and the alert hides itself with `peer-checked:hidden`. No JavaScript.
-->
<div class="mx-auto w-full max-w-lg space-y-3">
  <div class="flex gap-3 rounded-xl border border-gray-200 bg-white p-3.5 dark:border-white/10 dark:bg-neutral-950" role="status">
    <svg class="mt-0.5 h-4 w-4 shrink-0 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 16v-4M12 8h.01" /></svg>
    <div class="min-w-0 flex-1">
      <p class="text-[13px] font-medium text-foreground dark:text-gray-100">Registry updated</p>
      <p class="mt-0.5 text-[12.5px] text-muted-foreground dark:text-muted-foreground">Three components changed in the latest release.</p>
    </div>
  </div>

  <div class="flex gap-3 rounded-xl border border-emerald-200 bg-emerald-50/60 p-3.5 dark:border-emerald-500/25 dark:bg-emerald-500/10" role="status">
    <svg class="mt-0.5 h-4 w-4 shrink-0 text-emerald-600 dark:text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M8.5 12.5l2.5 2.5 4.5-5" /></svg>
    <div class="min-w-0 flex-1">
      <p class="text-[13px] font-medium text-emerald-900 dark:text-emerald-200">Build passed</p>
      <p class="mt-0.5 text-[12.5px] text-emerald-700 dark:text-emerald-400/90">All 214 tests green in 6.4s.</p>
    </div>
  </div>

  <!-- Dismissible warning -->
  <span class="contents">
    <input type="checkbox" id="alert-warning" class="peer sr-only" />
    <div class="flex gap-3 rounded-xl border border-amber-200 bg-amber-50/70 p-3.5 peer-checked:hidden dark:border-amber-400/25 dark:bg-amber-400/10" role="status">
      <svg class="mt-0.5 h-4 w-4 shrink-0 text-amber-600 dark:text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z" /><path d="M12 9v4M12 17h.01" /></svg>
      <div class="min-w-0 flex-1">
        <p class="text-[13px] font-medium text-amber-900 dark:text-amber-200">Node 22 required</p>
        <p class="mt-0.5 text-[12.5px] text-amber-700 dark:text-amber-300/90">The runner image no longer ships Node 20.</p>
      </div>
      <label for="alert-warning" class="cursor-pointer rounded p-1 text-amber-500 transition hover:bg-amber-100 hover:text-amber-800 dark:hover:bg-amber-400/15 dark:hover:text-amber-200" aria-label="Dismiss">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </label>
    </div>
  </span>

  <!-- Dismissible error, with actions -->
  <span class="contents">
    <input type="checkbox" id="alert-error" class="peer sr-only" />
    <div class="flex gap-3 rounded-xl border border-red-200 bg-red-50/70 p-3.5 peer-checked:hidden dark:border-red-500/25 dark:bg-red-500/10" role="alert">
      <svg class="mt-0.5 h-4 w-4 shrink-0 text-red-600 dark:text-red-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M15 9l-6 6M9 9l6 6" /></svg>
      <div class="min-w-0 flex-1">
        <p class="text-[13px] font-medium text-red-900 dark:text-red-200">Deployment failed</p>
        <p class="mt-0.5 text-[12.5px] text-red-700 dark:text-red-300/90">The e2e job exited with status 1.</p>
        <div class="mt-2 flex gap-2">
          <button type="button" class="rounded-md bg-red-600 px-2.5 py-1 text-[12px] font-medium text-white transition hover:bg-red-700">Retry</button>
          <button type="button" class="rounded-md px-2.5 py-1 text-[12px] font-medium text-red-700 transition hover:bg-red-100 dark:text-red-300 dark:hover:bg-red-500/15">View logs</button>
        </div>
      </div>
      <label for="alert-error" class="cursor-pointer self-start rounded p-1 text-red-400 transition hover:bg-red-100 hover:text-red-700 dark:hover:bg-red-500/15 dark:hover:text-red-300" aria-label="Dismiss">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </label>
    </div>
  </span>

  <!-- Dismissible banner -->
  <span class="contents">
    <input type="checkbox" id="alert-banner" class="peer sr-only" />
    <div class="flex items-center gap-2 rounded-lg bg-gray-900 px-3.5 py-2.5 peer-checked:hidden dark:bg-white">
      <span class="text-[12.5px] font-medium text-white dark:text-neutral-900">v0.2.0 is out — 11 new screens.</span>
      <a href="#" class="ml-auto text-[12.5px] font-medium text-white underline underline-offset-2 dark:text-neutral-900">Read the notes</a>
      <label for="alert-banner" class="cursor-pointer rounded p-0.5 text-white/60 transition hover:text-white dark:text-neutral-900/50 dark:hover:text-neutral-900" aria-label="Dismiss">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </label>
    </div>
  </span>
</div>
