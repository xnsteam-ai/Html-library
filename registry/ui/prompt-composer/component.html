<!--
  Prompt Composer — a rounded message box with an inline toolbar.
  The textarea, model pickers and send button are real controls; the focus ring
  is driven by `focus-within` so the whole shell lights up as you type.
-->
<div class="mx-auto w-full max-w-[640px]">
  <form
    class="overflow-hidden rounded-[24px] border border-gray-200 bg-white transition focus-within:border-gray-300 focus-within:ring-1 focus-within:ring-gray-100 dark:border-white/15 dark:bg-neutral-900 dark:focus-within:border-white/25 dark:focus-within:ring-white/10"
  >
    <label for="pc-message" class="sr-only">Message</label>
    <textarea
      id="pc-message"
      rows="1"
      placeholder="Send a message…"
      class="block w-full resize-none bg-transparent px-4 pb-2 pt-4 text-[15px] leading-relaxed text-gray-800 outline-none placeholder:text-gray-400 dark:text-gray-100 dark:placeholder:text-gray-500"
    ></textarea>

    <div class="flex items-center justify-between px-3 pb-3 pt-1">
      <!-- Left controls -->
      <div class="flex items-center gap-0.5">
        <button
          type="button"
          class="rounded-lg p-1.5 text-gray-400 transition hover:bg-gray-50 hover:text-gray-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-200 dark:hover:bg-white/10 dark:hover:text-gray-200 dark:focus-visible:ring-white/20"
          aria-label="Add attachment"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>

        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg px-2 py-1.5 text-[13px] text-gray-500 transition hover:bg-gray-50 hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-200 dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100 dark:focus-visible:ring-white/20"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          <svg class="text-gray-400 dark:text-gray-500" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z" />
          </svg>
          Agent
          <svg class="ml-0.5 text-gray-400 opacity-70 dark:text-gray-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>

        <button
          type="button"
          class="flex items-center gap-1.5 rounded-lg px-2 py-1.5 text-[13px] text-gray-500 transition hover:bg-gray-50 hover:text-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-200 dark:text-gray-400 dark:hover:bg-white/10 dark:hover:text-gray-100 dark:focus-visible:ring-white/20"
          aria-haspopup="listbox"
          aria-expanded="false"
        >
          Sonnet 4.6
          <svg class="ml-0.5 text-gray-400 opacity-70 dark:text-gray-500" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
      </div>

      <!-- Send -->
      <button
        type="submit"
        class="mr-1 flex h-[30px] w-[30px] items-center justify-center rounded-full bg-gray-100 text-gray-400 transition hover:bg-gray-200 hover:text-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-200 dark:bg-white/10 dark:text-gray-400 dark:hover:bg-white/20 dark:hover:text-gray-100 dark:focus-visible:ring-white/20"
        aria-label="Send message"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </button>
    </div>
  </form>
</div>
