<!-- Switch List — Fluent UI style labeled toggle rows, restored with its own scoped theme -->
<style>
  .fswl-root { --bg-surface: #ffffff; --text-primary: #242424; --text-secondary: #616161; --text-muted: #707070; --border-color: #e0e0e0; --bg-hover: #f0f0f0; --fluent-brand: #0f6cbd; --fluent-switch-bg: #ffffff; --fluent-switch-border: #616161; --fluent-switch-thumb: #616161; }
  .dark .fswl-root { --bg-surface: #333333; --text-primary: #ffffff; --text-secondary: #d1d1d1; --text-muted: #adadad; --border-color: #424242; --bg-hover: #3d3d3d; --fluent-brand: #479ef5; --fluent-switch-bg: #333333; --fluent-switch-border: #d1d1d1; --fluent-switch-thumb: #d1d1d1; }
</style>

<div class="fswl-root mx-auto w-full max-w-lg rounded-lg border border-[var(--border-color)] bg-[var(--bg-surface)] p-6 shadow-sm">
  <h2 class="mb-2 text-[15px] font-semibold text-[var(--text-primary)]">Notifications</h2>
  <p class="mb-6 text-[13px] text-[var(--text-secondary)]">Manage how you receive alerts and updates.</p>

  <div class="flex flex-col rounded-lg border border-[var(--border-color)]">
    <div class="flex items-start justify-between border-b border-[var(--border-color)] p-4">
      <div class="flex flex-col gap-1 pr-6">
        <span class="text-[14px] font-medium text-[var(--text-primary)]">Email notifications</span>
        <span class="text-[13px] text-[var(--text-secondary)]">Receive a daily summary of missed alerts in your inbox.</span>
      </div>
      <label class="fswl-track relative mt-1 inline-flex h-5 w-10 shrink-0 cursor-pointer items-center rounded-full border border-[var(--fluent-switch-border)] bg-[var(--fluent-switch-bg)]">
        <input type="checkbox" class="peer sr-only" checked />
        <span class="pointer-events-none absolute inset-0 rounded-full bg-transparent transition-colors peer-checked:border-[var(--fluent-brand)] peer-checked:bg-[var(--fluent-brand)]"></span>
        <span class="pointer-events-none relative h-3 w-3 translate-x-[3px] rounded-full bg-[var(--fluent-switch-thumb)] transition-transform peer-checked:translate-x-[23px] peer-checked:bg-white"></span>
      </label>
    </div>

    <div class="flex items-start justify-between border-b border-[var(--border-color)] p-4">
      <div class="flex flex-col gap-1 pr-6">
        <span class="text-[14px] font-medium text-[var(--text-primary)]">Push notifications</span>
        <span class="text-[13px] text-[var(--text-secondary)]">Get real-time alerts pushed to your mobile device or browser.</span>
      </div>
      <label class="fswl-track relative mt-1 inline-flex h-5 w-10 shrink-0 cursor-pointer items-center rounded-full border border-[var(--fluent-switch-border)] bg-[var(--fluent-switch-bg)]">
        <input type="checkbox" class="peer sr-only" />
        <span class="pointer-events-none absolute inset-0 rounded-full bg-transparent transition-colors peer-checked:border-[var(--fluent-brand)] peer-checked:bg-[var(--fluent-brand)]"></span>
        <span class="pointer-events-none relative h-3 w-3 translate-x-[3px] rounded-full bg-[var(--fluent-switch-thumb)] transition-transform peer-checked:translate-x-[23px] peer-checked:bg-white"></span>
      </label>
    </div>

    <div class="flex items-start justify-between bg-[var(--bg-hover)] p-4">
      <div class="flex flex-col gap-1 pr-6">
        <span class="text-[14px] font-medium text-[var(--text-muted)]">Marketing updates</span>
        <span class="text-[13px] text-[var(--text-muted)]">Receive promotional materials. (Managed by admin)</span>
      </div>
      <label class="fswl-track relative mt-1 inline-flex h-5 w-10 shrink-0 cursor-not-allowed items-center rounded-full border border-[var(--fluent-switch-border)] bg-[var(--fluent-switch-bg)] opacity-40">
        <input type="checkbox" class="peer sr-only" disabled />
        <span class="pointer-events-none absolute inset-0 rounded-full bg-transparent peer-checked:border-[var(--fluent-brand)] peer-checked:bg-[var(--fluent-brand)]"></span>
        <span class="pointer-events-none relative h-3 w-3 translate-x-[3px] rounded-full bg-[var(--fluent-switch-thumb)] peer-checked:translate-x-[23px] peer-checked:bg-white"></span>
      </label>
    </div>
  </div>
</div>
