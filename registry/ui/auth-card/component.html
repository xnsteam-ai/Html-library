<!--
  Auth Card — sign-in panel with crosshair corner marks.
  The four hairlines and the two plus glyphs bleed outside the card, so the
  wrapper keeps padding for them rather than clipping.
-->
<div class="mx-auto w-full max-w-md px-6 py-6">
  <div class="relative rounded-xl border border-gray-200 bg-white p-6 md:p-8 dark:border-white/15 dark:bg-neutral-900">
    <!-- Hairlines extending past each edge -->
    <div class="pointer-events-none absolute -inset-y-6 -left-px hidden w-px bg-gray-200 md:block dark:bg-white/15"></div>
    <div class="pointer-events-none absolute -inset-y-6 -right-px hidden w-px bg-gray-200 md:block dark:bg-white/15"></div>
    <div class="pointer-events-none absolute -inset-x-6 -top-px hidden h-px bg-gray-200 md:block dark:bg-white/15"></div>
    <div class="pointer-events-none absolute -inset-x-6 -bottom-px hidden h-px bg-gray-200 md:block dark:bg-white/15"></div>

    <!-- Corner crosses -->
    <svg class="pointer-events-none absolute left-0 top-0 z-10 h-5 w-5 -translate-x-1/2 -translate-y-1/2 text-muted-foreground/70 dark:text-white/25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
      <path d="M5 12h14M12 5v14" />
    </svg>
    <svg class="pointer-events-none absolute bottom-0 right-0 z-10 h-5 w-5 translate-x-1/2 translate-y-1/2 text-muted-foreground/70 dark:text-white/25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true">
      <path d="M5 12h14M12 5v14" />
    </svg>

    <div class="relative z-20 space-y-7">
      <div class="flex flex-col space-y-1">
        <h1 class="text-[22px] font-bold tracking-wide text-foreground dark:text-gray-100">Join now</h1>
        <p class="text-[14px] text-muted-foreground dark:text-muted-foreground">Log in or create your account.</p>
      </div>

      <div class="space-y-3">
        <div>
          <label for="ac-email" class="sr-only">Email</label>
          <div class="flex w-full items-center rounded-lg border border-gray-200 transition focus-within:border-gray-900 focus-within:ring-1 focus-within:ring-gray-900 dark:border-white/15 dark:focus-within:border-white dark:focus-within:ring-white">
            <span class="pl-3 text-muted-foreground dark:text-muted-foreground">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="m22 7-10 6L2 7" />
              </svg>
            </span>
            <input
              id="ac-email"
              type="email"
              placeholder="you@example.com"
              class="w-full bg-transparent px-3 py-2.5 text-[13.5px] text-foreground outline-none placeholder:text-muted-foreground dark:text-gray-100 dark:placeholder:text-muted-foreground"
            />
          </div>
        </div>

        <div>
          <label for="ac-password" class="sr-only">Password</label>
          <div class="flex w-full items-center rounded-lg border border-gray-200 transition focus-within:border-gray-900 focus-within:ring-1 focus-within:ring-gray-900 dark:border-white/15 dark:focus-within:border-white dark:focus-within:ring-white">
            <span class="pl-3 text-muted-foreground dark:text-muted-foreground">
              <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input
              id="ac-password"
              type="password"
              placeholder="••••••••"
              class="w-full bg-transparent px-3 py-2.5 text-[13.5px] text-foreground outline-none placeholder:text-muted-foreground dark:text-gray-100 dark:placeholder:text-muted-foreground"
            />
          </div>
        </div>

        <button
          type="button"
          class="w-full rounded-lg bg-gray-900 px-4 py-2.5 text-[13.5px] font-medium text-white transition hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200 dark:focus-visible:ring-white dark:focus-visible:ring-offset-neutral-950"
        >
          Continue
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3">
        <span class="h-px flex-1 bg-gray-200 dark:bg-white/15"></span>
        <span class="text-[11.5px] uppercase tracking-wide text-muted-foreground dark:text-muted-foreground">or</span>
        <span class="h-px flex-1 bg-gray-200 dark:bg-white/15"></span>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <button
          type="button"
          class="flex items-center justify-center gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2 text-[13px] font-medium text-foreground transition hover:bg-gray-50 dark:border-white/15 dark:bg-transparent dark:text-gray-200 dark:hover:bg-white/10"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.33-1.29-1.69-1.29-1.69-1.05-.72.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.4-5.26 5.69.41.36.78 1.06.78 2.14 0 1.55-.02 2.8-.02 3.18 0 .31.21.68.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z" />
          </svg>
          GitHub
        </button>
        <button
          type="button"
          class="flex items-center justify-center gap-2 rounded-lg border border-gray-200 bg-white px-3 py-2 text-[13px] font-medium text-foreground transition hover:bg-gray-50 dark:border-white/15 dark:bg-transparent dark:text-gray-200 dark:hover:bg-white/10"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3.01h3.88c2.27-2.09 3.58-5.17 3.58-8.82Z" />
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.94-2.91l-3.88-3.01c-1.08.72-2.45 1.15-4.06 1.15-3.12 0-5.76-2.11-6.71-4.94H1.29v3.1A12 12 0 0 0 12 24Z" />
            <path fill="#FBBC05" d="M5.29 14.29a7.2 7.2 0 0 1 0-4.58v-3.1H1.29a12 12 0 0 0 0 10.78l4-3.1Z" />
            <path fill="#EA4335" d="M12 4.75c1.76 0 3.34.61 4.59 1.8l3.44-3.44C17.95 1.19 15.23 0 12 0A12 12 0 0 0 1.29 6.61l4 3.1C6.24 6.86 8.88 4.75 12 4.75Z" />
          </svg>
          Google
        </button>
      </div>

      <p class="text-center text-[12px] text-muted-foreground dark:text-muted-foreground">
        By continuing you agree to our
        <a href="#" class="text-foreground underline underline-offset-2 dark:text-gray-100">Terms</a>.
      </p>
    </div>
  </div>
</div>
