<!--
  Badge Pill — shadcn-style semantic variants: default, secondary, outline
  and destructive, each with a focus ring for keyboard use inside a
  focusable parent (e.g. wrapped in a button or link).
-->
<div class="mx-auto w-full max-w-lg">
  <div class="flex flex-wrap items-center gap-2">
    <span class="inline-flex h-5 w-fit shrink-0 items-center justify-center gap-1 overflow-hidden rounded-full border border-transparent bg-gray-900 px-2 text-xs font-medium text-white transition-all dark:bg-white dark:text-neutral-900">
      Default
    </span>
    <span class="inline-flex h-5 w-fit shrink-0 items-center justify-center gap-1 overflow-hidden rounded-full border border-transparent bg-gray-100 px-2 text-xs font-medium text-gray-700 transition-all dark:bg-white/10 dark:text-gray-300">
      Secondary
    </span>
    <span class="inline-flex h-5 w-fit shrink-0 items-center justify-center gap-1 overflow-hidden rounded-full border border-gray-200 px-2 text-xs font-medium text-gray-900 transition-all dark:border-white/15 dark:text-gray-100">
      Outline
    </span>
    <span class="inline-flex h-5 w-fit shrink-0 items-center justify-center gap-1 overflow-hidden rounded-full border border-transparent bg-red-50 px-2 text-xs font-medium text-red-600 transition-all dark:bg-red-500/15 dark:text-red-400">
      Destructive
    </span>
  </div>
</div>
