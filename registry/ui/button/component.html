<!-- Button — variants, sizes and states -->
<div class="mx-auto w-full max-w-lg space-y-5">
  <!-- Variants -->
  <div class="flex flex-wrap items-center gap-2.5">
    <button type="button" class="rounded-lg bg-gray-900 px-3.5 py-2 text-[13px] font-medium text-white transition hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200 dark:focus-visible:ring-white dark:focus-visible:ring-offset-neutral-950">
      Primary
    </button>
    <button type="button" class="rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-[13px] font-medium text-gray-800 transition hover:bg-gray-50 dark:border-white/15 dark:bg-transparent dark:text-gray-200 dark:hover:bg-white/10">
      Secondary
    </button>
    <button type="button" class="rounded-lg px-3.5 py-2 text-[13px] font-medium text-gray-600 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/10">
      Ghost
    </button>
    <button type="button" class="rounded-lg bg-red-600 px-3.5 py-2 text-[13px] font-medium text-white transition hover:bg-red-700 dark:bg-red-500 dark:hover:bg-red-600">
      Destructive
    </button>
    <a href="#" class="rounded-lg px-1 py-2 text-[13px] font-medium text-gray-900 underline underline-offset-4 transition hover:text-gray-600 dark:text-gray-100 dark:hover:text-gray-400">
      Link
    </a>
  </div>

  <!-- Sizes -->
  <div class="flex flex-wrap items-center gap-2.5">
    <button type="button" class="rounded-md bg-gray-900 px-2.5 py-1 text-[12px] font-medium text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200">Small</button>
    <button type="button" class="rounded-lg bg-gray-900 px-3.5 py-2 text-[13px] font-medium text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200">Medium</button>
    <button type="button" class="rounded-xl bg-gray-900 px-5 py-2.5 text-[15px] font-medium text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200">Large</button>
    <button type="button" class="flex h-9 w-9 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-50 dark:border-white/15 dark:text-gray-300 dark:hover:bg-white/10" aria-label="Settings">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1A1.7 1.7 0 008 19.4a1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H2a2 2 0 110-4h.1A1.7 1.7 0 004.6 8a1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V2a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H22a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z" /></svg>
    </button>
  </div>

  <!-- States -->
  <div class="flex flex-wrap items-center gap-2.5">
    <button type="button" class="flex items-center gap-2 rounded-lg bg-gray-900 px-3.5 py-2 text-[13px] font-medium text-white dark:bg-white dark:text-neutral-900">
      <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-white/30 border-t-white motion-reduce:animate-none dark:border-neutral-900/30 dark:border-t-neutral-900"></span>
      Saving…
    </button>
    <button type="button" disabled class="cursor-not-allowed rounded-lg bg-gray-200 px-3.5 py-2 text-[13px] font-medium text-gray-400 dark:bg-white/10 dark:text-gray-600">
      Disabled
    </button>
    <button type="button" class="flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-[13px] font-medium text-gray-800 transition hover:bg-gray-50 dark:border-white/15 dark:bg-transparent dark:text-gray-200 dark:hover:bg-white/10">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14" /></svg>
      With icon
    </button>
  </div>
</div>
