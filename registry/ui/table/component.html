<!-- Table — Fluent UI style employee table, restored with its own scoped theme -->
<style>
  .ftb-root { --bg-surface: #ffffff; --text-primary: #242424; --text-secondary: #616161; --border-color: #e0e0e0; --bg-hover: #f0f0f0; }
  .dark .ftb-root { --bg-surface: #333333; --text-primary: #ffffff; --text-secondary: #d1d1d1; --border-color: #424242; --bg-hover: #3d3d3d; }
</style>

<div class="ftb-root mx-auto w-full max-w-2xl overflow-hidden rounded-lg border border-[var(--border-color)] bg-[var(--bg-surface)] shadow-sm">
  <div class="border-b border-[var(--border-color)] p-6">
    <h2 class="text-[16px] font-semibold text-[var(--text-primary)]">Employees</h2>
    <p class="text-[13px] text-[var(--text-secondary)]">A list of all employees in the organization.</p>
  </div>

  <div class="w-full overflow-x-auto">
    <table class="w-full whitespace-nowrap text-left text-[13.5px]">
      <thead>
        <tr class="border-b border-[var(--border-color)] bg-[var(--bg-surface)]">
          <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">Name</th>
          <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">Title</th>
          <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">Department</th>
          <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">Role</th>
        </tr>
      </thead>
      <tbody>
        <tr class="border-b border-[var(--border-color)] transition-colors hover:bg-[var(--bg-hover)]">
          <td class="px-6 py-3 font-medium text-[var(--text-primary)]">Lindsay Walton</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Front-end Developer</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Engineering</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Member</td>
        </tr>
        <tr class="border-b border-[var(--border-color)] transition-colors hover:bg-[var(--bg-hover)]">
          <td class="px-6 py-3 font-medium text-[var(--text-primary)]">Courtney Henry</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Designer</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Design</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Admin</td>
        </tr>
        <tr class="border-b border-[var(--border-color)] transition-colors hover:bg-[var(--bg-hover)]">
          <td class="px-6 py-3 font-medium text-[var(--text-primary)]">Tom Cook</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Director of Product</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Product</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Member</td>
        </tr>
        <tr class="transition-colors hover:bg-[var(--bg-hover)]">
          <td class="px-6 py-3 font-medium text-[var(--text-primary)]">Whitney Francis</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Copywriter</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Marketing</td>
          <td class="px-6 py-3 text-[var(--text-secondary)]">Admin</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
