<!-- Input — text field, search, prefix, error and textarea -->
<div class="mx-auto w-full max-w-sm space-y-4">
  <!-- Labelled -->
  <div>
    <label for="field-email" class="mb-1.5 block text-[12.5px] font-medium text-gray-700 dark:text-muted-foreground">Email</label>
    <input id="field-email" type="email" placeholder="you@example.com" class="w-full rounded-lg border border-gray-200 bg-white px-3 py-2 text-[13.5px] text-gray-900 placeholder:text-gray-400 focus:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-900/10 dark:border-white/15 dark:bg-neutral-950 dark:text-gray-100 dark:placeholder:text-gray-600 dark:focus:border-white/30 dark:focus:ring-white/10" />
    <p class="mt-1.5 text-[11.5px] text-gray-600 dark:text-muted-foreground">We only use this for build notifications.</p>
  </div>

  <!-- Search with icon and shortcut -->
  <div class="relative">
    <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-gray-400 dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
    <input type="search" placeholder="Search…" aria-label="Search" class="w-full rounded-lg border border-gray-200 bg-white py-2 pl-9 pr-14 text-[13.5px] text-gray-900 placeholder:text-gray-400 focus:border-gray-400 focus:outline-none dark:border-white/15 dark:bg-neutral-950 dark:text-gray-100 dark:placeholder:text-gray-600 dark:focus:border-white/30" />
    <kbd class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 rounded border border-gray-200 px-1.5 py-0.5 font-mono text-[10.5px] text-gray-400 dark:border-white/15 dark:text-muted-foreground">⌘K</kbd>
  </div>

  <!-- With prefix -->
  <div class="flex items-stretch overflow-hidden rounded-lg border border-gray-200 focus-within:border-gray-400 dark:border-white/15 dark:focus-within:border-white/30">
    <span class="flex items-center bg-gray-50 px-3 text-[13px] text-gray-600 dark:bg-white/5 dark:text-muted-foreground">github.com/</span>
    <input type="text" placeholder="handle" aria-label="GitHub handle" class="min-w-0 flex-1 bg-white px-3 py-2 text-[13.5px] text-gray-900 placeholder:text-gray-400 focus:outline-none dark:bg-neutral-950 dark:text-gray-100 dark:placeholder:text-gray-600" />
  </div>

  <!-- Error -->
  <div>
    <label for="field-token" class="mb-1.5 block text-[12.5px] font-medium text-gray-700 dark:text-muted-foreground">Access token</label>
    <input id="field-token" type="text" value="ghp_invalid" aria-invalid="true" class="w-full rounded-lg border border-red-300 bg-white px-3 py-2 text-[13.5px] text-gray-900 focus:border-red-400 focus:outline-none focus:ring-2 focus:ring-red-500/10 dark:border-red-500/40 dark:bg-neutral-950 dark:text-gray-100" />
    <p class="mt-1.5 flex items-center gap-1 text-[11.5px] text-red-600 dark:text-red-400">
      <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M12 8v4M12 16h.01" /></svg>
      That token was rejected by GitHub.
    </p>
  </div>

  <!-- Textarea + disabled -->
  <textarea rows="3" placeholder="Describe the change…" aria-label="Description" class="w-full resize-none rounded-lg border border-gray-200 bg-white px-3 py-2 text-[13.5px] text-gray-900 placeholder:text-gray-400 focus:border-gray-400 focus:outline-none dark:border-white/15 dark:bg-neutral-950 dark:text-gray-100 dark:placeholder:text-gray-600 dark:focus:border-white/30"></textarea>
  <input type="text" value="Read only" disabled class="w-full cursor-not-allowed rounded-lg border border-gray-200 bg-gray-50 px-3 py-2 text-[13.5px] text-gray-400 dark:border-white/10 dark:bg-white/5 dark:text-muted-foreground" />
</div>
