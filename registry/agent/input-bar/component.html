<!--
  Input Bar — a working composer. The textarea is real, the Tools and model
  dropdowns genuinely open, and the send button enables itself only once you
  type (`:placeholder-shown` inverted). No JavaScript.
-->
<div class="mx-auto w-full max-w-2xl">
  <div class="group/bar rounded-xl border border-gray-200 bg-white shadow-sm focus-within:border-gray-300 dark:border-white/10 dark:bg-neutral-950 dark:shadow-none dark:focus-within:border-white/20">
    <label for="input-bar-message" class="sr-only">Write a message</label>
    <textarea id="input-bar-message" rows="3" placeholder="Write a message…" class="w-full resize-none bg-transparent px-4 pt-3.5 text-[15px] leading-relaxed text-gray-900 placeholder:text-gray-400 focus:outline-none dark:text-gray-100 dark:placeholder:text-gray-600"></textarea>

    <div class="flex items-center justify-between px-3 pb-3">
      <div class="flex items-center gap-1">
        <label class="flex h-7 w-7 cursor-pointer items-center justify-center rounded-full border border-gray-200 text-gray-600 transition hover:bg-gray-50 dark:border-white/15 dark:text-gray-300 dark:hover:bg-white/10" aria-label="Add attachment">
          <input type="file" class="sr-only" multiple />
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </label>

        <!-- Tools dropdown -->
        <details class="group/tools relative">
          <summary class="flex cursor-pointer list-none items-center gap-1.5 rounded-md px-2 py-1.5 text-[12.5px] font-medium text-gray-600 transition hover:bg-gray-100 group-open/tools:bg-gray-100 [&::-webkit-details-marker]:hidden dark:text-gray-300 dark:hover:bg-white/10 dark:group-open/tools:bg-white/10">
            <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.9H20l-4.9 3.6 1.9 5.9-5-3.7-5 3.7 1.9-5.9L4 8.9h6.1z" /></svg>
            Tools
          </summary>
          <div class="absolute bottom-full left-0 z-10 mb-2 w-52 overflow-hidden rounded-xl border border-gray-200 bg-white p-1 shadow-lg shadow-gray-200/50 dark:border-white/10 dark:bg-neutral-950 dark:shadow-black/40">
            <label class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-[13px] text-gray-700 transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
              <input type="checkbox" class="peer sr-only" checked />
              <span class="flex h-3.5 w-3.5 items-center justify-center rounded border border-gray-300 text-transparent peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
                <svg class="h-2 w-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
              </span>
              Web search
            </label>
            <label class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-[13px] text-gray-700 transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
              <input type="checkbox" class="peer sr-only" checked />
              <span class="flex h-3.5 w-3.5 items-center justify-center rounded border border-gray-300 text-transparent peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
                <svg class="h-2 w-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
              </span>
              Run code
            </label>
            <label class="flex cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-[13px] text-gray-700 transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
              <input type="checkbox" class="peer sr-only" />
              <span class="flex h-3.5 w-3.5 items-center justify-center rounded border border-gray-300 text-transparent peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
                <svg class="h-2 w-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
              </span>
              Browse files
            </label>
          </div>
        </details>
      </div>

      <div class="flex items-center gap-2">
        <!-- Model dropdown -->
        <details class="group/model relative">
          <summary class="flex cursor-pointer list-none items-center gap-1 rounded-md px-2 py-1.5 text-[12.5px] font-medium text-gray-700 transition hover:bg-gray-100 group-open/model:bg-gray-100 [&::-webkit-details-marker]:hidden dark:text-gray-200 dark:hover:bg-white/10 dark:group-open/model:bg-white/10">
            <span class="group-has-[#input-bar-opus:checked]/model:inline hidden">Opus 4.8</span>
            <span class="group-has-[#input-bar-sonnet:checked]/model:inline hidden">Sonnet 4.8</span>
            <span class="group-has-[#input-bar-haiku:checked]/model:inline hidden">Haiku 4.5</span>
            <svg class="h-3 w-3 text-gray-600 transition group-open/model:rotate-180 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
          </summary>
          <div class="absolute bottom-full right-0 z-10 mb-2 w-44 overflow-hidden rounded-xl border border-gray-200 bg-white p-1 shadow-lg shadow-gray-200/50 dark:border-white/10 dark:bg-neutral-950 dark:shadow-black/40">
            <label for="input-bar-opus" class="flex cursor-pointer items-center justify-between rounded-lg px-2.5 py-2 text-[13px] text-gray-700 transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
              <input type="radio" name="input-bar-model" id="input-bar-opus" class="peer sr-only" checked />
              Opus 4.8
              <svg class="hidden h-3.5 w-3.5 peer-checked:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
            </label>
            <label for="input-bar-sonnet" class="flex cursor-pointer items-center justify-between rounded-lg px-2.5 py-2 text-[13px] text-gray-700 transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
              <input type="radio" name="input-bar-model" id="input-bar-sonnet" class="peer sr-only" />
              Sonnet 4.8
              <svg class="hidden h-3.5 w-3.5 peer-checked:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
            </label>
            <label for="input-bar-haiku" class="flex cursor-pointer items-center justify-between rounded-lg px-2.5 py-2 text-[13px] text-gray-700 transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
              <input type="radio" name="input-bar-model" id="input-bar-haiku" class="peer sr-only" />
              Haiku 4.5
              <svg class="hidden h-3.5 w-3.5 peer-checked:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
            </label>
          </div>
        </details>

        <button type="button" class="rounded-md p-1.5 text-gray-600 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/10" aria-label="Dictate">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0014 0M12 18v4" /></svg>
        </button>

        <!-- Enabled only once the textarea has content -->
        <button type="submit" class="flex h-7 w-7 items-center justify-center rounded-full bg-gray-200 text-gray-400 transition group-has-[#input-bar-message:not(:placeholder-shown)]/bar:bg-gray-900 group-has-[#input-bar-message:not(:placeholder-shown)]/bar:text-white dark:bg-white/10 dark:text-gray-600 dark:group-has-[#input-bar-message:not(:placeholder-shown)]/bar:bg-white dark:group-has-[#input-bar-message:not(:placeholder-shown)]/bar:text-neutral-900" aria-label="Send message">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
        </button>
      </div>
    </div>
  </div>
  <p class="mt-2 text-center text-[11.5px] text-gray-400 dark:text-gray-600">
    The agent can make mistakes. Verify important output.
  </p>
</div>
