<!-- Input Bar — composer with attachments, model control and send -->
<div class="mx-auto w-full max-w-2xl">
  <div class="rounded-xl border border-gray-200 bg-white shadow-sm focus-within:border-gray-300 dark:border-white/10 dark:bg-neutral-950 dark:shadow-none dark:focus-within:border-white/20">
    <label for="input-bar-message" class="sr-only">Write a message</label>
    <textarea id="input-bar-message" rows="3" placeholder="Write a message…" class="w-full resize-none bg-transparent px-4 pt-3.5 text-[15px] leading-relaxed text-gray-900 placeholder:text-gray-400 focus:outline-none dark:text-gray-100 dark:placeholder:text-gray-500"></textarea>

    <div class="flex items-center justify-between px-3 pb-3">
      <div class="flex items-center gap-1">
        <button type="button" class="flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 text-gray-600 transition hover:bg-gray-50 dark:border-white/15 dark:text-gray-300 dark:hover:bg-white/10" aria-label="Add attachment">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button type="button" class="flex items-center gap-1.5 rounded-md px-2 py-1.5 text-[12.5px] font-medium text-gray-600 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/10">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.9H20l-4.9 3.6 1.9 5.9-5-3.7-5 3.7 1.9-5.9L4 8.9h6.1z" /></svg>
          Tools
        </button>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" class="flex items-center gap-1 rounded-md px-2 py-1.5 text-[12.5px] font-medium text-gray-700 transition hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-white/10">
          Opus 4.8
          <span class="text-gray-400 dark:text-gray-500">High</span>
          <svg class="h-3 w-3 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
        </button>
        <button type="button" class="rounded-md p-1.5 text-gray-500 transition hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/10" aria-label="Dictate">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3" /><path d="M5 11a7 7 0 0014 0M12 18v4" /></svg>
        </button>
        <button type="button" class="flex h-7 w-7 items-center justify-center rounded-full bg-gray-900 text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200" aria-label="Send message">
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
        </button>
      </div>
    </div>
  </div>
  <p class="mt-2 text-center text-[11.5px] text-gray-400 dark:text-gray-500">
    The agent can make mistakes. Verify important output.
  </p>
</div>
