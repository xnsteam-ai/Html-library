<!--
  Tool Group — genuinely collapsible, no JavaScript.
  Each level is a native <details>. The chevrons rotate via `group-open:`,
  and the whole group collapses independently of its children.
-->
<details open class="group/run mx-auto w-full max-w-2xl overflow-hidden rounded-xl border border-gray-200 dark:border-white/10">
  <summary class="flex w-full cursor-pointer list-none items-center gap-2 bg-gray-50 px-3 py-2.5 text-left transition hover:bg-gray-100 [&::-webkit-details-marker]:hidden dark:bg-white/5 dark:hover:bg-white/10">
    <svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground transition group-open/run:rotate-0 -rotate-90 dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6" /></svg>
    <span class="flex-1 text-[12.5px] font-medium text-foreground dark:text-gray-200">Investigated the failing build</span>
    <span class="flex -space-x-1">
      <span class="flex h-5 w-5 items-center justify-center rounded-full border border-white bg-gray-100 text-muted-foreground dark:border-neutral-950 dark:bg-white/10 dark:text-muted-foreground">
        <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8" /></svg>
      </span>
      <span class="flex h-5 w-5 items-center justify-center rounded-full border border-white bg-gray-100 text-muted-foreground dark:border-neutral-950 dark:bg-white/10 dark:text-muted-foreground">
        <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
      </span>
      <span class="flex h-5 w-5 items-center justify-center rounded-full border border-white bg-gray-100 text-muted-foreground dark:border-neutral-950 dark:bg-white/10 dark:text-muted-foreground">
        <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" /></svg>
      </span>
    </span>
    <span class="shrink-0 text-[11px] text-muted-foreground dark:text-muted-foreground">3 steps · 8.1s</span>
  </summary>

  <div class="divide-y divide-gray-100 dark:divide-white/5">
    <!-- Child 1 -->
    <details class="group/step">
      <summary class="flex w-full cursor-pointer list-none items-center gap-2.5 px-3 py-2 text-left transition hover:bg-gray-50 [&::-webkit-details-marker]:hidden dark:hover:bg-white/5">
        <svg class="h-3 w-3 shrink-0 text-muted-foreground transition group-open/step:rotate-90 dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
        <svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8" /></svg>
        <code class="min-w-0 flex-1 truncate font-mono text-[11.5px] text-muted-foreground dark:text-muted-foreground">gh run view 41902 --log-failed</code>
        <span class="shrink-0 text-[10.5px] text-muted-foreground dark:text-muted-foreground">1.4s</span>
      </summary>
      <pre class="mx-3 mb-2.5 overflow-x-auto rounded-lg bg-gray-50 px-3 py-2 font-mono text-[11px] leading-relaxed text-muted-foreground dark:bg-white/5 dark:text-muted-foreground">e2e  ✗ failed in 41s
  Error: Unsupported engine for node@20.11.0</pre>
    </details>

    <!-- Child 2 -->
    <details open class="group/step">
      <summary class="flex w-full cursor-pointer list-none items-center gap-2.5 px-3 py-2 text-left transition hover:bg-gray-50 [&::-webkit-details-marker]:hidden dark:hover:bg-white/5">
        <svg class="h-3 w-3 shrink-0 text-muted-foreground transition group-open/step:rotate-90 dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
        <svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
        <code class="min-w-0 flex-1 truncate font-mono text-[11.5px] text-muted-foreground dark:text-muted-foreground">rg "engines" package.json</code>
        <span class="shrink-0 text-[10.5px] text-muted-foreground dark:text-muted-foreground">0.2s</span>
      </summary>
      <pre class="mx-3 mb-2.5 overflow-x-auto rounded-lg bg-gray-50 px-3 py-2 font-mono text-[11px] leading-relaxed text-muted-foreground dark:bg-white/5 dark:text-muted-foreground">14:  "engines": { "node": "&gt;=20 &lt;22" }</pre>
    </details>

    <!-- Running child -->
    <div class="flex w-full items-center gap-2.5 px-3 py-2">
      <span class="h-3 w-3 shrink-0"></span>
      <span class="h-3.5 w-3.5 shrink-0 animate-spin rounded-full border-2 border-gray-200 border-t-gray-900 motion-reduce:animate-none dark:border-white/15 dark:border-t-white"></span>
      <code class="min-w-0 flex-1 truncate font-mono text-[11.5px] text-muted-foreground dark:text-muted-foreground">edit package.json</code>
      <span class="shrink-0 text-[10.5px] text-muted-foreground dark:text-muted-foreground">running</span>
    </div>
  </div>
</details>
