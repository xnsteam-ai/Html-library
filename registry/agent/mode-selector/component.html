<!-- Mode Selector — segmented pill toggle for agent modes -->
<div class="mx-auto w-full max-w-md space-y-5">
  <!-- Icon + label segments -->
  <div class="flex rounded-full bg-gray-100 p-[3px] dark:bg-white/10" role="tablist" aria-label="Agent mode">
    <button type="button" role="tab" aria-selected="true" class="flex flex-1 items-center justify-center gap-1.5 rounded-full bg-white px-3 py-1.5 text-[13px] font-medium text-gray-900 shadow-sm dark:bg-neutral-900 dark:text-gray-100">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10" /></svg>
      Chat
    </button>
    <button type="button" role="tab" aria-selected="false" class="flex flex-1 items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-medium text-gray-500 transition hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6" /></svg>
      Code
    </button>
    <button type="button" role="tab" aria-selected="false" class="flex flex-1 items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-medium text-gray-500 transition hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200">
      <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8" /><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9" /></svg>
      Plan
    </button>
  </div>

  <!-- Compact bordered variant -->
  <div class="inline-flex rounded-lg border border-gray-200 p-0.5 dark:border-white/10" role="tablist" aria-label="Permission mode">
    <button type="button" role="tab" aria-selected="false" class="rounded-md px-2.5 py-1 text-[12px] font-medium text-gray-500 transition hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100">Ask</button>
    <button type="button" role="tab" aria-selected="true" class="rounded-md bg-gray-900 px-2.5 py-1 text-[12px] font-medium text-white dark:bg-white dark:text-neutral-900">Auto</button>
    <button type="button" role="tab" aria-selected="false" class="rounded-md px-2.5 py-1 text-[12px] font-medium text-gray-500 transition hover:text-gray-900 dark:text-gray-400 dark:hover:text-gray-100">Read only</button>
  </div>
</div>
