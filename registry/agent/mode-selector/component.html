<!--
  Mode Selector — working segmented controls, no JavaScript.
  Each segment is a radio input inside its label; the label styles itself from
  its own input via `peer-checked:`. Keyboard arrow-keys work natively because
  these are real radio groups.
-->
<div class="mx-auto w-full max-w-md space-y-5">
  <!-- Icon + label segments -->
  <div class="flex rounded-full bg-gray-100 p-[3px] dark:bg-white/10" role="radiogroup" aria-label="Agent mode">
    <label class="flex-1">
      <input type="radio" name="mode-selector-agent" class="peer sr-only" checked />
      <span class="flex cursor-pointer items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-medium text-gray-600 transition hover:text-gray-800 peer-checked:bg-white peer-checked:text-gray-900 peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 dark:text-gray-400 dark:hover:text-gray-200 dark:peer-checked:bg-neutral-900 dark:peer-checked:text-gray-100 dark:peer-focus-visible:ring-white">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10" /></svg>
        Chat
      </span>
    </label>
    <label class="flex-1">
      <input type="radio" name="mode-selector-agent" class="peer sr-only" />
      <span class="flex cursor-pointer items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-medium text-gray-600 transition hover:text-gray-800 peer-checked:bg-white peer-checked:text-gray-900 peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 dark:text-gray-400 dark:hover:text-gray-200 dark:peer-checked:bg-neutral-900 dark:peer-checked:text-gray-100 dark:peer-focus-visible:ring-white">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6" /></svg>
        Code
      </span>
    </label>
    <label class="flex-1">
      <input type="radio" name="mode-selector-agent" class="peer sr-only" />
      <span class="flex cursor-pointer items-center justify-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-medium text-gray-600 transition hover:text-gray-800 peer-checked:bg-white peer-checked:text-gray-900 peer-checked:shadow-sm peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 dark:text-gray-400 dark:hover:text-gray-200 dark:peer-checked:bg-neutral-900 dark:peer-checked:text-gray-100 dark:peer-focus-visible:ring-white">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8" /><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9" /></svg>
        Plan
      </span>
    </label>
  </div>

  <!-- Compact bordered variant -->
  <div class="inline-flex rounded-lg border border-gray-200 p-0.5 dark:border-white/10" role="radiogroup" aria-label="Permission mode">
    <label>
      <input type="radio" name="mode-selector-permission" class="peer sr-only" />
      <span class="block cursor-pointer rounded-md px-2.5 py-1 text-[12px] font-medium text-gray-600 transition hover:text-gray-900 peer-checked:bg-gray-900 peer-checked:text-white dark:text-gray-400 dark:hover:text-gray-100 dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">Ask</span>
    </label>
    <label>
      <input type="radio" name="mode-selector-permission" class="peer sr-only" checked />
      <span class="block cursor-pointer rounded-md px-2.5 py-1 text-[12px] font-medium text-gray-600 transition hover:text-gray-900 peer-checked:bg-gray-900 peer-checked:text-white dark:text-gray-400 dark:hover:text-gray-100 dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">Auto</span>
    </label>
    <label>
      <input type="radio" name="mode-selector-permission" class="peer sr-only" />
      <span class="block cursor-pointer rounded-md px-2.5 py-1 text-[12px] font-medium text-gray-600 transition hover:text-gray-900 peer-checked:bg-gray-900 peer-checked:text-white dark:text-gray-400 dark:hover:text-gray-100 dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">Read only</span>
    </label>
  </div>
</div>
