<!--
  Chat Welcome — the empty-state screen before any messages: a centred
  greeting above a rounded composer with a teal send button and a
  scroll-to-bottom affordance parked above it.

  Palette is the source's own: slate for text, borders and surfaces, with
  #20b8cd as the accent. The dark surface is #0b0f19, which has no Tailwind
  equivalent.
-->
<div class="mx-auto flex w-full max-w-2xl flex-col items-center justify-center gap-10 p-8">
  <div class="w-full text-center">
    <h1 class="mb-1 text-2xl font-semibold text-slate-900 dark:text-slate-200">Hello there!</h1>
    <p class="text-2xl text-slate-500 opacity-65 dark:text-slate-400">How can I help you today?</p>
  </div>

  <div class="relative w-full">
    <!-- Scroll-to-bottom affordance, parked above the composer -->
    <button
      type="button"
      aria-label="Scroll to bottom"
      class="absolute -top-12 left-1/2 z-10 flex h-9 w-9 -translate-x-1/2 items-center justify-center rounded-full border border-slate-200 bg-white text-slate-500 shadow-[0_2px_8px_rgba(0,0,0,0.08)] transition hover:bg-slate-100 hover:text-slate-900 dark:border-slate-800 dark:bg-[#0b0f19] dark:text-slate-400 dark:hover:bg-slate-800 dark:hover:text-slate-200"
    >
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6" /></svg>
    </button>

    <form class="flex w-full flex-col rounded-2xl border border-slate-200 bg-white transition focus-within:border-[#20b8cd] focus-within:ring-[3px] focus-within:ring-[#20b8cd]/15 dark:border-slate-800 dark:bg-[#0b0f19]">
      <label for="cw-message" class="sr-only">Message</label>
      <textarea
        id="cw-message"
        rows="1"
        placeholder="Send a message..."
        class="max-h-32 min-h-[3.5rem] w-full resize-none bg-transparent px-4 py-3 text-[14px] leading-normal text-slate-900 outline-none placeholder:text-slate-500 dark:text-slate-200 dark:placeholder:text-slate-400"
      ></textarea>
      <div class="flex items-center justify-end px-2 pb-2">
        <button
          type="submit"
          aria-label="Send message"
          class="flex h-8 w-8 items-center justify-center rounded-full bg-[#20b8cd] text-black transition hover:scale-105 hover:opacity-85"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M13.854 8.14576L8.854 3.14576C8.659 2.95076 8.342 2.95076 8.147 3.14576C7.952 3.34076 7.952 3.65776 8.147 3.85276L12.293 7.99876H2.5C2.224 7.99876 2 8.22276 2 8.49876C2 8.77476 2.224 8.99876 2.5 8.99876H12.293L8.147 13.1448C7.952 13.3398 7.952 13.6568 8.147 13.8518C8.245 13.9498 8.373 13.9978 8.501 13.9978C8.629 13.9978 8.757 13.9488 8.855 13.8518L13.855 8.85176C14.05 8.65676 14.05 8.33976 13.855 8.14476L13.854 8.14576Z" /></svg>
        </button>
      </div>
    </form>
  </div>
</div>
