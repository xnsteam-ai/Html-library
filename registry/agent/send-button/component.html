<!-- Send Button — idle, disabled, busy (stop) and labelled variants -->
<div class="mx-auto flex w-full max-w-md flex-wrap items-center justify-center gap-6">
  <!-- Idle -->
  <div class="flex flex-col items-center gap-2">
    <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-900 text-white transition hover:bg-gray-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-gray-900 focus-visible:ring-offset-2 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200 dark:focus-visible:ring-white dark:focus-visible:ring-offset-neutral-950" aria-label="Send message">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
    </button>
    <span class="text-[11px] text-gray-400 dark:text-gray-500">Idle</span>
  </div>

  <!-- Disabled -->
  <div class="flex flex-col items-center gap-2">
    <button type="button" disabled class="flex h-8 w-8 cursor-not-allowed items-center justify-center rounded-full bg-gray-200 text-gray-400 dark:bg-white/10 dark:text-gray-600" aria-label="Send message">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
    </button>
    <span class="text-[11px] text-gray-400 dark:text-gray-500">Disabled</span>
  </div>

  <!-- Busy / stop -->
  <div class="flex flex-col items-center gap-2">
    <button type="button" class="flex h-8 w-8 items-center justify-center rounded-full bg-gray-900 text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200" aria-label="Stop generating">
      <span class="h-2.5 w-2.5 rounded-[2px] bg-current"></span>
    </button>
    <span class="text-[11px] text-gray-400 dark:text-gray-500">Generating</span>
  </div>

  <!-- Labelled -->
  <div class="flex flex-col items-center gap-2">
    <button type="button" class="flex items-center gap-1.5 rounded-full bg-gray-900 px-3.5 py-1.5 text-[13px] font-medium text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900 dark:hover:bg-gray-200">
      Send
      <span class="rounded border border-white/25 px-1 font-mono text-[10px] leading-4 dark:border-black/20">↵</span>
    </button>
    <span class="text-[11px] text-gray-400 dark:text-gray-500">With hint</span>
  </div>
</div>
