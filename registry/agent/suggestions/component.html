<!-- Suggestions — prompt starters as chips and as rows -->
<div class="mx-auto w-full max-w-2xl space-y-6">
  <!-- Chip row -->
  <div class="flex flex-wrap gap-2">
    <button type="button" class="flex items-center gap-1.5 rounded-full border border-gray-200 bg-white px-3 py-1.5 text-[12.5px] font-medium text-gray-700 transition hover:border-gray-300 hover:bg-gray-50 dark:border-white/10 dark:bg-neutral-950 dark:text-gray-200 dark:hover:border-white/20 dark:hover:bg-white/5">
      <svg class="h-3.5 w-3.5 text-gray-400 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-6-6-6M12 19h8" /></svg>
      Explain this repo
    </button>
    <button type="button" class="flex items-center gap-1.5 rounded-full border border-gray-200 bg-white px-3 py-1.5 text-[12.5px] font-medium text-gray-700 transition hover:border-gray-300 hover:bg-gray-50 dark:border-white/10 dark:bg-neutral-950 dark:text-gray-200 dark:hover:border-white/20 dark:hover:bg-white/5">
      <svg class="h-3.5 w-3.5 text-gray-400 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" /></svg>
      Write a migration
    </button>
    <button type="button" class="flex items-center gap-1.5 rounded-full border border-gray-200 bg-white px-3 py-1.5 text-[12.5px] font-medium text-gray-700 transition hover:border-gray-300 hover:bg-gray-50 dark:border-white/10 dark:bg-neutral-950 dark:text-gray-200 dark:hover:border-white/20 dark:hover:bg-white/5">
      <svg class="h-3.5 w-3.5 text-gray-400 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
      Find dead code
    </button>
    <button type="button" class="flex items-center gap-1.5 rounded-full border border-gray-200 bg-white px-3 py-1.5 text-[12.5px] font-medium text-gray-700 transition hover:border-gray-300 hover:bg-gray-50 dark:border-white/10 dark:bg-neutral-950 dark:text-gray-200 dark:hover:border-white/20 dark:hover:bg-white/5">
      <svg class="h-3.5 w-3.5 text-gray-400 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18" /></svg>
      Add a test
    </button>
  </div>

  <!-- Stacked rows -->
  <div class="divide-y divide-gray-200 overflow-hidden rounded-xl border border-gray-200 dark:divide-white/10 dark:border-white/10">
    <button type="button" class="flex w-full items-center gap-3 px-3.5 py-3 text-left transition hover:bg-gray-50 dark:hover:bg-white/5">
      <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-gray-100 text-gray-600 dark:bg-white/10 dark:text-gray-300">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" /></svg>
      </span>
      <span class="min-w-0 flex-1">
        <span class="block text-[13.5px] font-medium text-gray-900 dark:text-gray-100">Review the open pull request</span>
        <span class="block truncate text-[12px] text-gray-600 dark:text-gray-400">Summarize the diff and flag risky changes</span>
      </span>
      <svg class="h-3.5 w-3.5 shrink-0 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
    </button>
    <button type="button" class="flex w-full items-center gap-3 px-3.5 py-3 text-left transition hover:bg-gray-50 dark:hover:bg-white/5">
      <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md bg-gray-100 text-gray-600 dark:bg-white/10 dark:text-gray-300">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9" /></svg>
      </span>
      <span class="min-w-0 flex-1">
        <span class="block text-[13.5px] font-medium text-gray-900 dark:text-gray-100">Debug the failing job</span>
        <span class="block truncate text-[12px] text-gray-600 dark:text-gray-400">Read the logs, find the root cause, propose a fix</span>
      </span>
      <svg class="h-3.5 w-3.5 shrink-0 text-gray-300 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6" /></svg>
    </button>
  </div>
</div>
