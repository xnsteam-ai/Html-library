<!--
  User Message — the sent turn, with a genuinely working edit mode.
  A hidden checkbox swaps the bubble for an editable textarea and back;
  the attachment removes itself. No JavaScript.
-->
<div class="mx-auto w-full max-w-2xl space-y-4">
  <!-- Plain -->
  <div class="flex justify-end">
    <div class="max-w-[85%] rounded-2xl rounded-br-md bg-gray-100 px-3.5 py-2.5 text-[14px] leading-relaxed text-gray-900 dark:bg-white/10 dark:text-gray-100">
      Rewrite this endpoint to stream the response instead of buffering it.
    </div>
  </div>

  <!-- With attachment, timestamp and an edit mode that actually toggles -->
  <div class="group/msg flex flex-col items-end gap-1.5">
    <input type="checkbox" id="user-message-editing" class="sr-only" />

    <!-- Read view -->
    <div class="max-w-[85%] space-y-2 rounded-2xl rounded-br-md bg-gray-100 px-3.5 py-3 group-has-[#user-message-editing:checked]/msg:hidden dark:bg-white/10">
      <span class="contents">
        <input type="checkbox" id="user-message-attachment" class="peer sr-only" />
        <span class="flex items-center gap-2 rounded-lg border border-gray-200 bg-white px-2.5 py-1.5 peer-checked:hidden dark:border-white/10 dark:bg-neutral-900">
          <svg class="h-4 w-4 shrink-0 text-gray-400 dark:text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" /></svg>
          <span class="truncate text-[12.5px] font-medium text-gray-800 dark:text-gray-200">handler.ts</span>
          <span class="text-[11px] text-gray-400 dark:text-gray-600">4.2 KB</span>
          <span class="ml-1 cursor-pointer rounded p-0.5 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10" role="button" aria-label="Remove handler.ts">
            <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
          </span>
        </span>
      </span>
      <p class="text-[14px] leading-relaxed text-gray-900 dark:text-gray-100">
        Here's the current handler — keep the error shape identical.
      </p>
    </div>

    <!-- Edit view -->
    <div class="hidden w-[85%] rounded-2xl border border-gray-300 bg-white p-2 group-has-[#user-message-editing:checked]/msg:block dark:border-white/20 dark:bg-neutral-900">
      <label for="user-message-draft" class="sr-only">Edit your message</label>
      <textarea id="user-message-draft" rows="3" class="w-full resize-none bg-transparent px-1.5 py-1 text-[14px] leading-relaxed text-gray-900 focus:outline-none dark:text-gray-100">Here's the current handler — keep the error shape identical.</textarea>
      <div class="flex justify-end gap-2 pt-1">
        <label for="user-message-editing" class="cursor-pointer rounded-lg px-2.5 py-1.5 text-[12.5px] font-medium text-gray-600 transition hover:bg-gray-100 dark:text-gray-300 dark:hover:bg-white/10">Cancel</label>
        <label for="user-message-editing" class="cursor-pointer rounded-lg bg-gray-900 px-3 py-1.5 text-[12.5px] font-medium text-white transition hover:bg-gray-700 dark:bg-white dark:text-neutral-900">Save</label>
      </div>
    </div>

    <div class="flex items-center gap-1.5 group-has-[#user-message-editing:checked]/msg:hidden">
      <span class="text-[11px] text-gray-400 dark:text-gray-600">2:14 PM</span>
      <label for="user-message-editing" class="cursor-pointer rounded-md p-1 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-gray-200" aria-label="Edit message">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" /></svg>
      </label>
      <button type="button" class="rounded-md p-1 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-gray-200" aria-label="Copy message">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2" /><path d="M5 15V5a2 2 0 012-2h10" /></svg>
      </button>
    </div>
  </div>
</div>
