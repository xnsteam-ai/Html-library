<!--
  Todo Tool — real checkboxes you can tick, no JavaScript.
  Each row is a <label> wrapping a checkbox; the tick, the strike-through and
  the row tint all follow `peer-checked:`.
-->
<div class="mx-auto w-full max-w-lg overflow-hidden rounded-xl border border-gray-200 dark:border-white/10">
  <div class="flex items-center gap-2 border-b border-gray-200 bg-gray-50 px-3 py-2 dark:border-white/10 dark:bg-white/5">
    <svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8" /><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9" /></svg>
    <span class="flex-1 text-[12.5px] font-medium text-foreground dark:text-gray-200">Task list</span>
    <span class="rounded-full bg-gray-100 px-2 py-0.5 text-[10.5px] font-medium text-muted-foreground dark:bg-white/10 dark:text-muted-foreground">5 tasks</span>
  </div>

  <ul class="divide-y divide-gray-100 dark:divide-white/5">
    <li>
      <label class="flex cursor-pointer items-start gap-2.5 px-3 py-2.5 transition hover:bg-gray-50 dark:hover:bg-white/5">
        <input type="checkbox" class="peer sr-only" checked />
        <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-[1.5px] border-gray-300 text-transparent transition peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 peer-focus-visible:ring-offset-1 dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
          <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
        </span>
        <span class="text-[13px] text-muted-foreground transition peer-checked:text-muted-foreground peer-checked:line-through dark:text-muted-foreground dark:peer-checked:text-muted-foreground">Reproduce the failing nightly run</span>
      </label>
    </li>

    <li>
      <label class="flex cursor-pointer items-start gap-2.5 px-3 py-2.5 transition hover:bg-gray-50 dark:hover:bg-white/5">
        <input type="checkbox" class="peer sr-only" checked />
        <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-[1.5px] border-gray-300 text-transparent transition peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 peer-focus-visible:ring-offset-1 dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
          <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
        </span>
        <span class="text-[13px] text-muted-foreground transition peer-checked:text-muted-foreground peer-checked:line-through dark:text-muted-foreground dark:peer-checked:text-muted-foreground">Locate the Node version mismatch</span>
      </label>
    </li>

    <li class="bg-gray-50 dark:bg-white/5">
      <label class="flex cursor-pointer items-start gap-2.5 px-3 py-2.5">
        <input type="checkbox" class="peer sr-only" />
        <span class="mt-0.5 h-4 w-4 shrink-0 animate-spin rounded-full border-2 border-gray-200 border-t-gray-900 transition peer-checked:animate-none motion-reduce:animate-none dark:border-white/15 dark:border-t-white"></span>
        <span class="flex-1 text-[13px] font-medium text-foreground transition peer-checked:text-muted-foreground peer-checked:line-through dark:text-gray-100 dark:peer-checked:text-muted-foreground">Pin the dependency to Node 22</span>
        <span class="rounded bg-white px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground shadow-sm peer-checked:hidden dark:bg-neutral-900 dark:text-muted-foreground">in progress</span>
      </label>
    </li>

    <li>
      <label class="flex cursor-pointer items-start gap-2.5 px-3 py-2.5 transition hover:bg-gray-50 dark:hover:bg-white/5">
        <input type="checkbox" class="peer sr-only" />
        <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-[1.5px] border-gray-300 text-transparent transition peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 peer-focus-visible:ring-offset-1 dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
          <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
        </span>
        <span class="text-[13px] text-muted-foreground transition peer-checked:text-muted-foreground peer-checked:line-through dark:text-muted-foreground dark:peer-checked:text-muted-foreground">Re-run the e2e job on the branch</span>
      </label>
    </li>

    <li>
      <label class="flex cursor-pointer items-start gap-2.5 px-3 py-2.5 transition hover:bg-gray-50 dark:hover:bg-white/5">
        <input type="checkbox" class="peer sr-only" />
        <span class="mt-0.5 flex h-4 w-4 shrink-0 items-center justify-center rounded-full border-[1.5px] border-gray-300 text-transparent transition peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-gray-900 peer-focus-visible:ring-offset-1 dark:border-white/20 dark:peer-checked:border-white dark:peer-checked:bg-white dark:peer-checked:text-neutral-900">
          <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
        </span>
        <span class="text-[13px] text-muted-foreground transition peer-checked:text-muted-foreground peer-checked:line-through dark:text-muted-foreground dark:peer-checked:text-muted-foreground">Open a PR with the lockfile update</span>
      </label>
    </li>
  </ul>
</div>
