<!--
  File Attachment — chips that genuinely remove themselves and cards for
  uploading / failed states. Removal uses a checkbox + `peer-checked:hidden`;
  no JavaScript.
-->
<div class="mx-auto w-full max-w-md space-y-3">
  <!-- Compact chip row -->
  <div class="flex flex-wrap gap-2">
    <span class="contents">
      <input type="checkbox" id="file-chip-schema" class="peer sr-only" />
      <span class="flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white py-1 pl-2 pr-1 peer-checked:hidden dark:border-white/10 dark:bg-neutral-950">
        <svg class="h-3.5 w-3.5 text-gray-400 dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" /></svg>
        <span class="max-w-[130px] truncate text-[12.5px] text-gray-800 dark:text-gray-200">schema.prisma</span>
        <label for="file-chip-schema" class="cursor-pointer rounded p-0.5 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-gray-200" aria-label="Remove schema.prisma">
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </label>
      </span>
    </span>

    <span class="contents">
      <input type="checkbox" id="file-chip-diagram" class="peer sr-only" />
      <span class="flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white py-1 pl-2 pr-1 peer-checked:hidden dark:border-white/10 dark:bg-neutral-950">
        <svg class="h-3.5 w-3.5 text-gray-400 dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" /></svg>
        <span class="max-w-[130px] truncate text-[12.5px] text-gray-800 dark:text-gray-200">flow-diagram.png</span>
        <label for="file-chip-diagram" class="cursor-pointer rounded p-0.5 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-gray-200" aria-label="Remove flow-diagram.png">
          <svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </label>
      </span>
    </span>
  </div>

  <!-- Uploading card, cancellable -->
  <span class="contents">
    <input type="checkbox" id="file-upload-logs" class="peer sr-only" />
    <div class="flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-3 peer-checked:hidden dark:border-white/10 dark:bg-neutral-950">
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-gray-100 text-gray-600 dark:bg-white/10 dark:text-muted-foreground">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" /></svg>
      </span>
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline justify-between gap-2">
          <span class="truncate text-[13px] font-medium text-gray-900 dark:text-gray-100">deployment-logs.txt</span>
          <span class="shrink-0 text-[11px] text-gray-400 dark:text-muted-foreground">62%</span>
        </div>
        <div class="mt-1.5 h-1 w-full overflow-hidden rounded-full bg-gray-100 dark:bg-white/10">
          <div class="h-full w-[62%] rounded-full bg-gray-900 dark:bg-white"></div>
        </div>
      </div>
      <label for="file-upload-logs" class="cursor-pointer rounded-md p-1 text-gray-400 transition hover:bg-gray-100 hover:text-gray-700 dark:hover:bg-white/10 dark:hover:text-gray-200" aria-label="Cancel upload">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
      </label>
    </div>
  </span>

  <!-- Failed card -->
  <div class="flex items-center gap-3 rounded-xl border border-red-200 bg-red-50/60 p-3 dark:border-red-500/25 dark:bg-red-500/10">
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-red-100 text-red-600 dark:bg-red-500/15 dark:text-red-400">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01" /><circle cx="12" cy="12" r="9" /></svg>
    </span>
    <div class="min-w-0 flex-1">
      <span class="block truncate text-[13px] font-medium text-gray-900 dark:text-gray-100">archive.zip</span>
      <span class="block text-[11.5px] text-red-600 dark:text-red-400">Too large — 48 MB of a 25 MB limit</span>
    </div>
    <label class="cursor-pointer rounded-md px-2 py-1 text-[12px] font-medium text-red-700 transition hover:bg-red-100 dark:text-red-300 dark:hover:bg-red-500/15">
      <input type="file" class="sr-only" />
      Replace
    </label>
  </div>
</div>
