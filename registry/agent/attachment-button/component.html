<!--
  Attachment Button — a real dropdown that opens and closes, no JavaScript.
  <details>/<summary> handles the disclosure; the file rows are real
  <label for> targets on a hidden <input type="file">, so "Upload a file"
  actually opens the OS file picker.
-->
<div class="mx-auto w-full max-w-[240px]">
  <input type="file" id="attachment-file" class="sr-only" multiple />
  <input type="file" id="attachment-image" class="sr-only" accept="image/*" />

  <details class="group/attach relative">
    <summary class="flex w-fit cursor-pointer list-none items-center gap-2 [&::-webkit-details-marker]:hidden">
      <span class="flex h-7 w-7 items-center justify-center rounded-full border border-gray-200 text-muted-foreground transition group-open/attach:bg-gray-100 group-open/attach:text-foreground hover:bg-gray-50 dark:border-white/15 dark:text-muted-foreground dark:group-open/attach:bg-white/10 dark:group-open/attach:text-white dark:hover:bg-white/10" aria-label="Add attachment">
        <svg class="h-3.5 w-3.5 transition group-open/attach:rotate-45" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
      </span>
    </summary>

    <div class="absolute left-0 z-10 mt-2 w-[220px] overflow-hidden rounded-xl border border-gray-200 bg-white p-1 shadow-lg shadow-gray-200/50 dark:border-white/10 dark:bg-neutral-950 dark:shadow-black/40" role="menu">
      <label for="attachment-file" role="menuitem" class="flex w-full cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-[13px] text-muted-foreground transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
        <svg class="h-4 w-4 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" /><path d="M14 2v6h6" /></svg>
        Upload a file
      </label>
      <label for="attachment-image" role="menuitem" class="flex w-full cursor-pointer items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-[13px] text-muted-foreground transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
        <svg class="h-4 w-4 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="8.5" cy="8.5" r="1.5" /><path d="M21 15l-5-5L5 21" /></svg>
        Add an image
      </label>
      <button type="button" role="menuitem" class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-[13px] text-muted-foreground transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
        <svg class="h-4 w-4 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M4 4h10l6 6v4" /><path d="M14 4v6h6" /></svg>
        Connect a repo
      </button>
      <div class="my-1 h-px bg-gray-100 dark:bg-white/10"></div>
      <button type="button" role="menuitem" class="flex w-full items-center gap-2.5 rounded-lg px-2.5 py-2 text-left text-[13px] text-muted-foreground transition hover:bg-gray-50 dark:text-gray-200 dark:hover:bg-white/5">
        <svg class="h-4 w-4 text-muted-foreground dark:text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" /><path d="M16 3H8v4h8z" /></svg>
        Paste from clipboard
      </button>
    </div>
  </details>
</div>
