<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude - AI Agents</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @layer base {
            :root {
                /* Overriding design system for screenshot fidelity */
                --color-background: #FDFCFB;
                --color-text-primary: #1D1D1F;
                --color-text-secondary: #555555;
                --color-border: #E5E5E5;
                --color-brand: #DD795D;
            }
        }
        @layer utilities {
            .text-balance {
                text-wrap: balance;
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif'],
                        'serif': ['Playfair Display', 'serif'],
                    },
                    colors: {
                        'brand-orange': 'var(--color-brand)',
                        'page-bg': 'var(--color-background)',
                        'text-primary': 'var(--color-text-primary)',
                        'text-secondary': 'var(--color-text-secondary)',
                        'border-light': 'var(--color-border)',
                    }
                }
            }
        }
    </script>

    <div id="root" class="flex flex-col min-h-screen">
        
        <!-- Header Navigation -->
        <header class="w-full bg-page-bg/80 backdrop-blur-sm sticky top-0 z-50">
            <div class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                    <!-- Desktop Navigation Links -->

                        <a href="#" class="flex items-center gap-1 hover:text-text-primary transition-colors">Solutions <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></a>
                        <a href="#" class="hover:text-text-primary transition-colors">Pricing</a>
                        <a href="#" class="flex items-center gap-1 hover:text-text-primary transition-colors">Resources <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg></a>

                    <!-- Action Buttons -->
                    <div class="flex items-center gap-2">
                        <a href="#" class="hidden sm:inline-block text-sm font-medium text-text-secondary hover:text-text-primary transition-colors">Login</a>
                        <a href="#" class="px-4 py-2 text-sm font-medium border border-border-light rounded-md hover:bg-zinc-100 transition-colors">Contact sales</a>

                </div>
            </div>

        <div class="border-b border-border-light">

                    <div class="flex items-center gap-2 grayscale opacity-80"><svg height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M7.083 14.167L2.917 10l4.166-4.167.98.98L4.876 10l3.187 3.187-.98.98zm5.834-8.334L8.75 10l4.167 4.167.98-.98L10.71 10l3.187-3.187-.98-.98z"/></svg><span class="text-lg font-semibold">augment code</span></div>
