  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Tabs component interactions
      document.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-slot="tabs-trigger"], [role="tab"]');
        if (trigger) {
          const tabsRoot = trigger.closest('[data-slot="tabs"]') || trigger.parentElement.parentElement;
          if (tabsRoot) {
            const allTriggers = tabsRoot.querySelectorAll('[data-slot="tabs-trigger"], [role="tab"]');
            const value = trigger.getAttribute('data-value') || trigger.getAttribute('value') || trigger.id;
            
            allTriggers.forEach(t => {
              t.setAttribute('data-state', 'inactive');
              t.setAttribute('aria-selected', 'false');
              t.classList.remove('data-active');
            });
            trigger.setAttribute('data-state', 'active');
            trigger.setAttribute('aria-selected', 'true');
            trigger.classList.add('data-active');

            const allContents = tabsRoot.querySelectorAll('[data-slot="tabs-content"], [role="tabpanel"]');
            allContents.forEach(content => {
              const contentValue = content.getAttribute('data-value') || content.getAttribute('value') || content.getAttribute('aria-labelledby');
              const isMatch = content.id === trigger.getAttribute('aria-controls') || 
                              contentValue === value || 
                              Array.from(allTriggers).indexOf(trigger) === Array.from(allContents).indexOf(content);
              
              if (isMatch) {
                content.setAttribute('data-state', 'active');
                content.style.setProperty('display', 'block', 'important');
              } else {
                content.setAttribute('data-state', 'inactive');
                content.style.setProperty('display', 'none', 'important');
              }
            });
          }
        }
      });

      // 2. Accordion component interactions
      document.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-slot="accordion-trigger"], [role="button"][id*="accordion"]');
        if (trigger) {
          const item = trigger.closest('[data-slot="accordion-item"]') || trigger.parentElement.parentElement;
          if (item) {
            const content = item.querySelector('[data-slot="accordion-content"]');
            const isCurrentOpen = trigger.getAttribute('data-state') === 'open';
            
            const accordionRoot = item.closest('[data-slot="accordion"]') || item.parentElement;
            if (accordionRoot && !accordionRoot.hasAttribute('data-collapsible')) {
              // If it's a single accordion (standard shadcn behavior), close others
              const allTriggers = accordionRoot.querySelectorAll('[data-slot="accordion-trigger"]');
              const allContents = accordionRoot.querySelectorAll('[data-slot="accordion-content"]');
              allTriggers.forEach(t => {
                t.setAttribute('data-state', 'closed');
                t.setAttribute('aria-expanded', 'false');
              });
              allContents.forEach(c => {
                c.setAttribute('data-state', 'closed');
                c.style.setProperty('display', 'none', 'important');
              });
            }

            if (isCurrentOpen) {
              trigger.setAttribute('data-state', 'closed');
              trigger.setAttribute('aria-expanded', 'false');
              if (content) {
                content.setAttribute('data-state', 'closed');
                content.style.setProperty('display', 'none', 'important');
              }
            } else {
              trigger.setAttribute('data-state', 'open');
              trigger.setAttribute('aria-expanded', 'true');
              if (content) {
                content.setAttribute('data-state', 'open');
                content.style.setProperty('display', 'block', 'important');
              }
            }
          }
        }
      });

      // 3. Collapsible interactions
      document.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-slot="collapsible-trigger"]');
        if (trigger) {
          const collapsible = trigger.closest('[data-slot="collapsible"]');
          if (collapsible) {
            const content = collapsible.querySelector('[data-slot="collapsible-content"]');
            const isOpen = collapsible.getAttribute('data-state') === 'open';
            if (isOpen) {
              collapsible.setAttribute('data-state', 'closed');
              trigger.setAttribute('data-state', 'closed');
              if (content) {
                content.setAttribute('data-state', 'closed');
                content.style.setProperty('display', 'none', 'important');
              }
            } else {
              collapsible.setAttribute('data-state', 'open');
              trigger.setAttribute('data-state', 'open');
              if (content) {
                content.setAttribute('data-state', 'open');
                content.style.setProperty('display', 'block', 'important');
              }
            }
          }
        }
      });

      // 4. Dropdown Menu interactions
      document.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-slot="dropdown-menu-trigger"], [id*="dropdown-trigger"]');
        if (trigger) {
          const menuId = trigger.getAttribute('aria-controls');
          const menu = document.getElementById(menuId) || trigger.nextElementSibling;
          if (menu) {
            const isOpen = trigger.getAttribute('data-state') === 'open';
            if (isOpen) {
              trigger.setAttribute('data-state', 'closed');
              menu.setAttribute('data-state', 'closed');
              menu.style.setProperty('display', 'none', 'important');
            } else {
              trigger.setAttribute('data-state', 'open');
              menu.setAttribute('data-state', 'open');
              menu.style.setProperty('display', 'block', 'important');
            }
          }
        } else {
          // Close all open menus when clicking outside
          document.querySelectorAll('[data-slot="dropdown-menu-trigger"][data-state="open"]').forEach(trig => {
            trig.setAttribute('data-state', 'closed');
            const menu = document.getElementById(trig.getAttribute('aria-controls')) || trig.nextElementSibling;
            if (menu) {
              menu.setAttribute('data-state', 'closed');
              menu.style.setProperty('display', 'none', 'important');
            }
          });
        }
      });

      // 5. Dialog & Sheet modal interactions
      document.addEventListener('click', (e) => {
        const trigger = e.target.closest('[data-slot="dialog-trigger"], [id*="dialog-trigger"]');
        if (trigger) {
          const dialogId = trigger.getAttribute('aria-controls');
          const dialog = document.getElementById(dialogId) || document.querySelector('[data-slot="dialog-content"]');
          if (dialog) {
            dialog.setAttribute('data-state', 'open');
            dialog.style.setProperty('display', 'flex', 'important');
            const overlay = dialog.parentElement.querySelector('[data-slot="dialog-overlay"]');
            if (overlay) overlay.style.setProperty('display', 'block', 'important');
          }
        }

        const closeBtn = e.target.closest('[data-slot="dialog-close"], [aria-label="Close"], .close-dialog');
        if (closeBtn) {
          const dialog = closeBtn.closest('[data-slot="dialog-content"]') || document.querySelector('[data-slot="dialog-content"]');
          if (dialog) {
            dialog.setAttribute('data-state', 'closed');
            dialog.style.setProperty('display', 'none', 'important');
            const overlay = dialog.parentElement.querySelector('[data-slot="dialog-overlay"]');
            if (overlay) overlay.style.setProperty('display', 'none', 'important');
          }
        }
      });

      // 6. Checkbox & Switch state toggles
      document.addEventListener('click', (e) => {
        const checkbox = e.target.closest('[data-slot="checkbox"], [data-slot="switch"], button[role="checkbox"], button[role="switch"]');
        if (checkbox) {
          const isChecked = checkbox.getAttribute('data-state') === 'checked' || checkbox.getAttribute('aria-checked') === 'true';
          if (isChecked) {
            checkbox.setAttribute('data-state', 'unchecked');
            checkbox.setAttribute('aria-checked', 'false');
            const input = checkbox.querySelector('input[type="checkbox"]');
            if (input) input.checked = false;
          } else {
            checkbox.setAttribute('data-state', 'checked');
            checkbox.setAttribute('aria-checked', 'true');
            const input = checkbox.querySelector('input[type="checkbox"]');
            if (input) input.checked = true;
          }
        }
      });

      // 7. Slider mouse dragging interactions
      document.addEventListener('mousedown', (e) => {
        const slider = e.target.closest('[data-slot="slider"]');
        if (slider) {
          const track = slider.querySelector('[data-slot="slider-track"]') || slider;
          const range = slider.querySelector('[data-slot="slider-range"]');
          const thumb = slider.querySelector('[data-slot="slider-thumb"]');
          
          const updateValue = (clientX) => {
            const rect = track.getBoundingClientRect();
            const percentage = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
            if (range) range.style.width = percentage + '%';
            if (thumb) thumb.style.left = percentage + '%';
            slider.setAttribute('data-value', percentage);
          };
          
          updateValue(e.clientX);
          
          const onMouseMove = (moveEvent) => {
            updateValue(moveEvent.clientX);
          };
          
          const onMouseUp = () => {
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };
          
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        }
      });

      // 8. Dark/Light Mode toggle buttons
      document.addEventListener('click', (e) => {
        const themeBtn = e.target.closest('[class*="theme-toggle"], [id*="theme-toggle"], button[aria-label*="theme"], button[aria-label*="mode"]');
        if (themeBtn) {
          const htmlEl = document.documentElement;
          if (htmlEl.classList.contains('dark')) {
            htmlEl.classList.remove('dark');
          } else {
            htmlEl.classList.add('dark');
          }
        }
      });

      // 9. Radio Group state toggles
      document.addEventListener('click', (e) => {
        const radio = e.target.closest('[data-slot="radio-group-item"], button[role="radio"]');
        if (radio) {
          const group = radio.closest('[data-slot="radio-group"], [role="radiogroup"]') || radio.parentElement.parentElement;
          if (group) {
            const allRadios = group.querySelectorAll('[data-slot="radio-group-item"], button[role="radio"]');
            allRadios.forEach(r => {
              r.setAttribute('data-state', 'unchecked');
              r.setAttribute('aria-checked', 'false');
              r.removeAttribute('data-checked');
            });
            radio.setAttribute('data-state', 'checked');
            radio.setAttribute('aria-checked', 'true');
            radio.setAttribute('data-checked', '');
          }
        }
      });
    });
  </script>
