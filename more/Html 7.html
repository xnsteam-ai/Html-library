<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Input Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Hide scrollbar for clean UI if textarea expands */
        textarea::-webkit-scrollbar {
            display: none;
        }
        textarea {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4">

    <!-- Main Input Container -->
    <form class="w-full max-w-[640px] border border-[#e5e7eb] bg-white rounded-[24px] overflow-hidden transition-colors focus-within:border-[#d1d5db] focus-within:ring-1 focus-within:ring-[#f3f4f6]">
        
        <!-- Textarea Area -->
        <textarea
            class="w-full block bg-transparent px-4 pt-4 pb-2 text-[15px] leading-relaxed text-gray-800 placeholder-[#9ca3af] resize-none outline-none"
            rows="1"
            placeholder="Send a message..."
            aria-label="Message input"
        ></textarea>

        <!-- Toolbar Area -->
        <div class="flex items-center justify-between px-3 pb-3 pt-1">
            
            <!-- Left Controls Group -->
            <div class="flex items-center gap-0.5">
                
                <!-- Add Attachment Button -->
                <button type="button" class="p-1.5 text-[#9ca3af] hover:text-gray-600 hover:bg-gray-50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-100" aria-label="Add attachment">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>

                <!-- Agent Selector Dropdown -->
                <button type="button" class="flex items-center gap-1.5 px-2 py-1.5 text-[13px] text-[#6b7280] hover:text-gray-800 hover:bg-gray-50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-100" aria-haspopup="listbox" aria-expanded="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#9ca3af]">
                        <path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/>
                    </svg>
                    Agent
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#9ca3af] ml-0.5 opacity-70">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>

                <!-- Model Selector Dropdown -->
                <button type="button" class="flex items-center gap-1.5 px-2 py-1.5 text-[13px] text-[#6b7280] hover:text-gray-800 hover:bg-gray-50 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-gray-100" aria-haspopup="listbox" aria-expanded="false">
                    Sonnet 4.6
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#9ca3af] ml-0.5 opacity-70">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
            </div>

            <!-- Send Button -->
            <button type="submit" class="w-[30px] h-[30px] flex items-center justify-center bg-[#f3f4f6] text-[#9ca3af] hover:bg-[#e5e7eb] hover:text-gray-700 rounded-full transition-all focus:outline-none focus:ring-2 focus:ring-gray-200 mr-1" aria-label="Send message">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
            </button>

        </div>
    </form>

</body>
</html>
