<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluent UI - Overlay Spinner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f5f5f5;
      --bg-surface: #ffffff;
      --text-primary: #242424;
      --text-secondary: #616161;
      --border-color: #e0e0e0;
      --fluent-brand: #0f6cbd;
      --fluent-brand-alpha: rgba(15, 108, 189, 0.2);
    }
    html.dark {
      --bg-app: #292929;
      --bg-surface: #333333;
      --text-primary: #ffffff;
      --text-secondary: #d1d1d1;
      --border-color: #424242;
      --fluent-brand: #479ef5;
      --fluent-brand-alpha: rgba(71, 158, 245, 0.2);
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    
    @keyframes fluentSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .fluent-spinner {
      border: 2px solid var(--fluent-brand-alpha);
      border-top-color: var(--fluent-brand);
      border-radius: 50%;
      animation: fluentSpin 1.3s cubic-bezier(0.53, 0.21, 0.29, 0.67) infinite;
    }
    
    .spinner-lg { width: 36px; height: 36px; border-width: 2.5px; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 relative">

  <!-- Theme Toggle -->
  <button id="themeToggleBtn" class="absolute top-6 right-6 w-8 h-8 rounded hover:bg-black/5 flex items-center justify-center transition-colors z-50">
    <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4 text-[var(--text-secondary)]"></i>
    <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 text-[var(--text-secondary)] hidden"></i>
  </button>

  <!-- Underlying Content -->
  <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-6 opacity-40 blur-[2px] pointer-events-none">
    <div class="bg-[var(--bg-surface)] h-64 rounded-lg border border-[var(--border-color)]"></div>
    <div class="bg-[var(--bg-surface)] h-64 rounded-lg border border-[var(--border-color)]"></div>
    <div class="bg-[var(--bg-surface)] h-64 rounded-lg border border-[var(--border-color)] md:col-span-2"></div>
  </div>

  <!-- Loading Overlay -->
  <div class="absolute inset-0 z-40 flex items-center justify-center bg-[var(--bg-app)]/60 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-4 bg-[var(--bg-surface)] px-10 py-8 rounded-xl shadow-lg border border-[var(--border-color)]">
      <div class="fluent-spinner spinner-lg"></div>
      <span class="text-sm font-medium text-[var(--text-primary)]">Loading data...</span>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Theme logic
    const toggleBtn = document.getElementById('themeToggleBtn');
    const moon = document.getElementById('themeIconMoon');
    const sun = document.getElementById('themeIconSun');
    
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      moon.classList.toggle('hidden', isDark);
      sun.classList.toggle('hidden', !isDark);
    });
  </script>
</body>
</html>
