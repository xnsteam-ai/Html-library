<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluent UI - Horizontal Nav</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f5f5f5;
      --bg-surface: #ffffff;
      --text-primary: #242424;
      --text-secondary: #616161;
      --text-muted: #707070;
      --border-color: #e0e0e0;
      --bg-hover: #f0f0f0;
      --bg-active: #ebebeb;
      --fluent-brand: #0f6cbd;
    }
    html.dark {
      --bg-app: #292929;
      --bg-surface: #333333;
      --text-primary: #ffffff;
      --text-secondary: #d1d1d1;
      --text-muted: #adadad;
      --border-color: #424242;
      --bg-hover: #3d3d3d;
      --bg-active: #474747;
      --fluent-brand: #479ef5;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    .fluent-nav-item {
      position: relative;
      padding: 0 12px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.1s;
      border-radius: 4px;
    }
    .fluent-nav-item:hover {
      background-color: var(--bg-hover);
    }
    .fluent-nav-item:active {
      background-color: var(--bg-active);
    }
    /* Indicator */
    .fluent-nav-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 12px;
      right: 12px;
      height: 3px;
      background-color: var(--fluent-brand);
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform 0.2s ease-out;
    }
    .fluent-nav-item.active {
      font-weight: 600;
    }
    .fluent-nav-item.active::after {
      transform: scaleX(1);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center pt-20">

  <!-- Container -->
  <div class="w-full max-w-4xl bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-lg shadow-sm p-6 relative">
    
    <!-- Theme Toggle -->
    <button id="themeToggleBtn" class="absolute top-4 right-4 w-8 h-8 rounded hover:bg-[var(--bg-hover)] flex items-center justify-center transition-colors">
      <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4 text-[var(--text-secondary)]"></i>
      <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 text-[var(--text-secondary)] hidden"></i>
    </button>

    <h2 class="text-xl font-semibold mb-6">Horizontal Navigation (Fluent TabNav)</h2>
    
    <nav class="flex border-b border-[var(--border-color)] pb-[1px]" role="tablist">
      <button class="fluent-nav-item active" role="tab" aria-selected="true">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Home</span>
      </button>
      <button class="fluent-nav-item" role="tab" aria-selected="false">
        <i data-lucide="file-text" class="w-4 h-4"></i>
        <span>Documents</span>
      </button>
      <button class="fluent-nav-item" role="tab" aria-selected="false">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span>Team</span>
      </button>
      <button class="fluent-nav-item" role="tab" aria-selected="false">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span>Settings</span>
      </button>
    </nav>
    
    <div class="mt-8 p-8 border border-dashed border-[var(--border-color)] rounded-lg text-center text-[var(--text-secondary)]">
      Page content goes here
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Navigation logic
    const navItems = document.querySelectorAll('.fluent-nav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(nav => {
          nav.classList.remove('active');
          nav.setAttribute('aria-selected', 'false');
        });
        item.classList.add('active');
        item.setAttribute('aria-selected', 'true');
      });
    });

    // Theme logic
    const toggleBtn = document.getElementById('themeToggleBtn');
    const moon = document.getElementById('themeIconMoon');
    const sun = document.getElementById('themeIconSun');
    
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      moon.classList.toggle('hidden', isDark);
      sun.classList.toggle('hidden', !isDark);
    });
  </script>
</body>
</html>
