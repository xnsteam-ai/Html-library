<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluent UI - Vertical Nav</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f5f5f5;
      --bg-surface: #ffffff;
      --text-primary: #242424;
      --text-secondary: #616161;
      --text-muted: #707070;
      --border-color: #e0e0e0;
      --bg-hover: #f0f0f0;
      --bg-active: #ebebeb;
      --bg-selected: #f0f6fa;
      --fluent-brand: #0f6cbd;
    }
    html.dark {
      --bg-app: #292929;
      --bg-surface: #333333;
      --text-primary: #ffffff;
      --text-secondary: #d1d1d1;
      --text-muted: #adadad;
      --border-color: #424242;
      --bg-hover: #3d3d3d;
      --bg-active: #474747;
      --bg-selected: #243a5e;
      --fluent-brand: #479ef5;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    .fluent-vnav-item {
      position: relative;
      padding: 0 16px;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 400;
      color: var(--text-primary);
      cursor: pointer;
      transition: background-color 0.1s;
      border-radius: 4px;
      margin-bottom: 2px;
    }
    .fluent-vnav-item:hover {
      background-color: var(--bg-hover);
    }
    .fluent-vnav-item:active {
      background-color: var(--bg-active);
    }
    /* Indicator */
    .fluent-vnav-item::before {
      content: '';
      position: absolute;
      top: 10px;
      bottom: 10px;
      left: 2px;
      width: 3px;
      background-color: var(--fluent-brand);
      border-radius: 4px;
      transform: scaleY(0);
      transition: transform 0.2s ease-out;
    }
    .fluent-vnav-item.active {
      font-weight: 600;
      background-color: var(--bg-selected);
    }
    .fluent-vnav-item.active::before {
      transform: scaleY(1);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center">

  <!-- Container -->
  <div class="w-full max-w-4xl bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-lg shadow-sm overflow-hidden flex min-h-[500px] relative">
    
    <!-- Theme Toggle -->
    <button id="themeToggleBtn" class="absolute top-4 right-4 w-8 h-8 rounded hover:bg-[var(--bg-hover)] flex items-center justify-center transition-colors z-10">
      <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4 text-[var(--text-secondary)]"></i>
      <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 text-[var(--text-secondary)] hidden"></i>
    </button>

    <!-- Sidebar Navigation -->
    <nav class="w-64 border-r border-[var(--border-color)] p-2 flex flex-col bg-[var(--bg-surface)] shrink-0">
      <div class="px-4 py-3 mb-2">
        <h2 class="text-sm font-semibold tracking-wide">Application</h2>
      </div>
      
      <button class="fluent-vnav-item active">
        <i data-lucide="home" class="w-5 h-5 text-[var(--text-secondary)]"></i>
        <span>Dashboard</span>
      </button>
      <button class="fluent-vnav-item">
        <i data-lucide="inbox" class="w-5 h-5 text-[var(--text-secondary)]"></i>
        <span>Inbox</span>
      </button>
      <button class="fluent-vnav-item">
        <i data-lucide="calendar" class="w-5 h-5 text-[var(--text-secondary)]"></i>
        <span>Calendar</span>
      </button>
      
      <div class="mt-auto pt-2 border-t border-[var(--border-color)]">
        <button class="fluent-vnav-item">
          <i data-lucide="settings" class="w-5 h-5 text-[var(--text-secondary)]"></i>
          <span>Settings</span>
        </button>
      </div>
    </nav>
    
    <!-- Content Area -->
    <div class="flex-1 p-8">
      <h1 class="text-2xl font-semibold mb-6">Vertical Navigation</h1>
      <p class="text-[var(--text-secondary)]">Content responds to sidebar selection.</p>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // Navigation logic
    const navItems = document.querySelectorAll('.fluent-vnav-item');
    navItems.forEach(item => {
      item.addEventListener('click', () => {
        navItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');
      });
    });

    // Theme logic
    const toggleBtn = document.getElementById('themeToggleBtn');
    const moon = document.getElementById('themeIconMoon');
    const sun = document.getElementById('themeIconSun');
    
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      moon.classList.toggle('hidden', isDark);
      sun.classList.toggle('hidden', !isDark);
    });
  </script>
</body>
</html>
