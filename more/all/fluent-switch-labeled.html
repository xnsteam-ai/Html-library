<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluent UI - Labeled Switch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f5f5f5;
      --bg-surface: #ffffff;
      --text-primary: #242424;
      --text-secondary: #616161;
      --text-muted: #707070;
      --border-color: #e0e0e0;
      --fluent-brand: #0f6cbd;
      --fluent-switch-bg: #ffffff;
      --fluent-switch-border: #616161;
      --fluent-switch-thumb: #616161;
      --fluent-switch-hover-bg: #f5f5f5;
    }
    html.dark {
      --bg-app: #292929;
      --bg-surface: #333333;
      --text-primary: #ffffff;
      --text-secondary: #d1d1d1;
      --text-muted: #adadad;
      --border-color: #424242;
      --fluent-brand: #479ef5;
      --fluent-switch-bg: #333333;
      --fluent-switch-border: #d1d1d1;
      --fluent-switch-thumb: #d1d1d1;
      --fluent-switch-hover-bg: #424242;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    
    .fluent-switch {
      width: 40px;
      height: 20px;
      border-radius: 10px;
      background-color: var(--fluent-switch-bg);
      border: 1px solid var(--fluent-switch-border);
      position: relative;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.33, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .fluent-switch:hover { background-color: var(--fluent-switch-hover-bg); }
    
    .fluent-switch-thumb {
      width: 12px;
      height: 12px;
      background-color: var(--fluent-switch-thumb);
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
      transition: all 0.2s cubic-bezier(0.33, 0, 0.2, 1);
    }
    
    .fluent-switch.checked {
      background-color: var(--fluent-brand);
      border-color: var(--fluent-brand);
    }
    .fluent-switch.checked .fluent-switch-thumb {
      background-color: #ffffff;
      left: 23px;
    }
    .fluent-switch.checked:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <!-- Container -->
  <div class="w-full max-w-lg bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-lg shadow-sm p-6 relative">
    
    <!-- Theme Toggle -->
    <button id="themeToggleBtn" class="absolute top-4 right-4 w-8 h-8 rounded hover:bg-black/5 flex items-center justify-center transition-colors">
      <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4 text-[var(--text-secondary)]"></i>
      <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 text-[var(--text-secondary)] hidden"></i>
    </button>

    <h2 class="text-xl font-semibold mb-2">Notifications</h2>
    <p class="text-sm text-[var(--text-secondary)] mb-6">Manage how you receive alerts and updates.</p>
    
    <div class="flex flex-col gap-0 border border-[var(--border-color)] rounded-lg overflow-hidden">
      
      <!-- Row 1 -->
      <div class="flex items-start justify-between p-4 border-b border-[var(--border-color)]">
        <div class="flex flex-col gap-1 pr-6 cursor-pointer select-none" onclick="this.nextElementSibling.click()">
          <span class="text-sm font-medium">Email notifications</span>
          <span class="text-[13px] text-[var(--text-secondary)]">Receive a daily summary of missed alerts in your inbox.</span>
        </div>
        <div class="fluent-switch mt-1 checked" role="switch" aria-checked="true" onclick="toggleSwitch(this)">
          <div class="fluent-switch-thumb"></div>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="flex items-start justify-between p-4 border-b border-[var(--border-color)]">
        <div class="flex flex-col gap-1 pr-6 cursor-pointer select-none" onclick="this.nextElementSibling.click()">
          <span class="text-sm font-medium">Push notifications</span>
          <span class="text-[13px] text-[var(--text-secondary)]">Get real-time alerts pushed to your mobile device or browser.</span>
        </div>
        <div class="fluent-switch mt-1" role="switch" aria-checked="false" onclick="toggleSwitch(this)">
          <div class="fluent-switch-thumb"></div>
        </div>
      </div>
      
      <!-- Row 3 -->
      <div class="flex items-start justify-between p-4 bg-[var(--bg-hover)]">
        <div class="flex flex-col gap-1 pr-6">
          <span class="text-sm font-medium text-[var(--text-muted)]">Marketing updates</span>
          <span class="text-[13px] text-[var(--text-muted)]">Receive promotional materials. (Managed by admin)</span>
        </div>
        <div class="fluent-switch mt-1 disabled opacity-40 cursor-not-allowed" role="switch" aria-checked="false">
          <div class="fluent-switch-thumb"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();

    function toggleSwitch(el) {
      if (el.classList.contains('disabled')) return;
      const isChecked = el.classList.contains('checked');
      if (isChecked) {
        el.classList.remove('checked');
        el.setAttribute('aria-checked', 'false');
      } else {
        el.classList.add('checked');
        el.setAttribute('aria-checked', 'true');
      }
    }

    const toggleBtn = document.getElementById('themeToggleBtn');
    const moon = document.getElementById('themeIconMoon');
    const sun = document.getElementById('themeIconSun');
    
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      moon.classList.toggle('hidden', isDark);
      sun.classList.toggle('hidden', !isDark);
    });
  </script>
</body>
</html>
