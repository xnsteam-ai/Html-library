<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluent UI - Interactive Table</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #f5f5f5;
      --bg-surface: #ffffff;
      --text-primary: #242424;
      --text-secondary: #616161;
      --border-color: #e0e0e0;
      --bg-hover: #f0f0f0;
      --bg-selected: #f3f2f1;
      --fluent-brand: #0f6cbd;
    }
    html.dark {
      --bg-app: #292929;
      --bg-surface: #333333;
      --text-primary: #ffffff;
      --text-secondary: #d1d1d1;
      --border-color: #424242;
      --bg-hover: #3d3d3d;
      --bg-selected: #3b3a39;
      --fluent-brand: #479ef5;
    }
    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    .fluent-checkbox {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid var(--text-secondary);
      border-radius: 4px;
      display: inline-block;
      position: relative;
      cursor: pointer;
      background-color: transparent;
      transition: all 0.2s;
    }
    .fluent-checkbox:checked {
      background-color: var(--fluent-brand);
      border-color: var(--fluent-brand);
    }
    .fluent-checkbox:checked::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 5px;
      width: 4px;
      height: 8px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    
    .table-row.selected {
      background-color: var(--bg-selected);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

  <!-- Container -->
  <div class="w-full max-w-5xl bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-lg shadow-sm overflow-hidden relative">
    
    <!-- Theme Toggle -->
    <button id="themeToggleBtn" class="absolute top-4 right-4 w-8 h-8 rounded hover:bg-[var(--bg-hover)] flex items-center justify-center transition-colors">
      <i data-lucide="moon" id="themeIconMoon" class="w-4 h-4 text-[var(--text-secondary)]"></i>
      <i data-lucide="sun" id="themeIconSun" class="w-4 h-4 text-[var(--text-secondary)] hidden"></i>
    </button>

    <div class="p-6 border-b border-[var(--border-color)] flex items-center justify-between">
      <div>
        <h2 class="text-lg font-semibold">Project Files</h2>
        <p class="text-sm text-[var(--text-secondary)]">Select files to perform bulk actions.</p>
      </div>
      <div class="flex gap-2 opacity-50 pointer-events-none transition-opacity" id="bulkActions">
        <button class="px-3 py-1.5 rounded bg-[var(--bg-hover)] text-sm font-medium border border-[var(--border-color)]">Download</button>
        <button class="px-3 py-1.5 rounded bg-[var(--bg-hover)] text-sm font-medium border border-[var(--border-color)] text-red-500">Delete</button>
      </div>
    </div>
    
    <div class="w-full overflow-x-auto">
      <table class="w-full text-left text-sm whitespace-nowrap">
        <thead>
          <tr class="border-b border-[var(--border-color)] bg-[var(--bg-surface)]">
            <th class="px-6 py-3 w-10"><input type="checkbox" id="selectAll" class="fluent-checkbox align-middle" /></th>
            <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">File Name</th>
            <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">Modified Date</th>
            <th class="px-6 py-3 font-semibold text-[var(--text-primary)]">Size</th>
            <th class="px-6 py-3 font-semibold text-[var(--text-primary)] text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr class="table-row border-b border-[var(--border-color)] hover:bg-[var(--bg-hover)] transition-colors">
            <td class="px-6 py-3"><input type="checkbox" class="fluent-checkbox row-checkbox align-middle" /></td>
            <td class="px-6 py-3 text-[var(--text-primary)] font-medium flex items-center gap-2">
              <i data-lucide="file-text" class="w-4 h-4 text-[var(--text-secondary)]"></i> Document.docx
            </td>
            <td class="px-6 py-3 text-[var(--text-secondary)]">Oct 24, 2023</td>
            <td class="px-6 py-3 text-[var(--text-secondary)]">24 KB</td>
            <td class="px-6 py-3 text-right">
              <button class="text-[var(--fluent-brand)] font-medium hover:underline">Edit</button>
            </td>
          </tr>
          <tr class="table-row border-b border-[var(--border-color)] hover:bg-[var(--bg-hover)] transition-colors">
            <td class="px-6 py-3"><input type="checkbox" class="fluent-checkbox row-checkbox align-middle" /></td>
            <td class="px-6 py-3 text-[var(--text-primary)] font-medium flex items-center gap-2">
              <i data-lucide="image" class="w-4 h-4 text-[var(--text-secondary)]"></i> Presentation.pptx
            </td>
            <td class="px-6 py-3 text-[var(--text-secondary)]">Oct 25, 2023</td>
            <td class="px-6 py-3 text-[var(--text-secondary)]">1.2 MB</td>
            <td class="px-6 py-3 text-right">
              <button class="text-[var(--fluent-brand)] font-medium hover:underline">Edit</button>
            </td>
          </tr>
          <tr class="table-row hover:bg-[var(--bg-hover)] transition-colors">
            <td class="px-6 py-3"><input type="checkbox" class="fluent-checkbox row-checkbox align-middle" /></td>
            <td class="px-6 py-3 text-[var(--text-primary)] font-medium flex items-center gap-2">
              <i data-lucide="table" class="w-4 h-4 text-[var(--text-secondary)]"></i> Budget.xlsx
            </td>
            <td class="px-6 py-3 text-[var(--text-secondary)]">Nov 1, 2023</td>
            <td class="px-6 py-3 text-[var(--text-secondary)]">450 KB</td>
            <td class="px-6 py-3 text-right">
              <button class="text-[var(--fluent-brand)] font-medium hover:underline">Edit</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    lucide.createIcons();
    
    // Table Selection Logic
    const selectAll = document.getElementById('selectAll');
    const checkboxes = document.querySelectorAll('.row-checkbox');
    const bulkActions = document.getElementById('bulkActions');

    function updateSelection() {
      let anyChecked = false;
      let allChecked = true;
      checkboxes.forEach(cb => {
        const row = cb.closest('.table-row');
        if (cb.checked) {
          row.classList.add('selected');
          anyChecked = true;
        } else {
          row.classList.remove('selected');
          allChecked = false;
        }
      });
      selectAll.checked = allChecked && checkboxes.length > 0;
      
      if (anyChecked) {
        bulkActions.classList.remove('opacity-50', 'pointer-events-none');
      } else {
        bulkActions.classList.add('opacity-50', 'pointer-events-none');
      }
    }

    selectAll.addEventListener('change', (e) => {
      const isChecked = e.target.checked;
      checkboxes.forEach(cb => {
        cb.checked = isChecked;
      });
      updateSelection();
    });

    checkboxes.forEach(cb => {
      cb.addEventListener('change', updateSelection);
    });

    // Theme logic
    const toggleBtn = document.getElementById('themeToggleBtn');
    const moon = document.getElementById('themeIconMoon');
    const sun = document.getElementById('themeIconSun');
    
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      moon.classList.toggle('hidden', isDark);
      sun.classList.toggle('hidden', !isDark);
    });
  </script>
</body>
</html>
